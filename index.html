<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CadernoWeb">
  <meta name="description" content="Caderno de desenho com ferramentas para uso offline no iPad.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <title>CadernoWeb</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eff1f5; color: #1c2430; }
    header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #dce0e7; box-shadow: 0 2px 12px #1721390d; }
    .header-inner { max-width: 1050px; padding: calc(6px + env(safe-area-inset-top)) 16px 6px; margin: auto; }
    :root { scroll-padding-top: calc(var(--header-height, 205px) + 12px); }
    .sheet-list { display: grid; gap: 22px; }
    .sheet { width: min(100%, 800px); min-width: 0; margin-inline: auto; }
    .sheet-title { margin: 0 0 8px; font-size: 14px; color: #526278; }
    .sheet .paper { width: 100%; }
    .objects-sheet { padding: 12px; background: #fff; border: 1px solid #8796a9; border-radius: 9px; }
    .objects-table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-bottom: 8px; }
    .objects-table th, .objects-table td { border: 1px solid #8796a9; }
    .objects-table th { padding: 6px 2px; font-size: 13px; background: #eff1f5; }
    .objects-table th:first-child { width: 34%; }
    .objects-table th:last-child { width: 24%; }
    .objects-table input { width: 100%; min-width: 0; padding: 6px 4px; font: inherit; font-size: 16px;
      color: inherit; border: 0; border-radius: 0; background: transparent; }
    .objects-table input:focus { outline: 2px solid #1675d1; outline-offset: -2px; }
    .objects-table td { overflow-wrap: anywhere; }
    .objects-table td:has(span) { padding: 6px 4px; }
    button.sheet-preview { display: block; padding: 0; text-align: left; }
    .sheet-preview img, .sheet-preview-text { position: absolute; pointer-events: none; }
    .sheet-preview img { width: 65%; }
    .sheet-preview-text { inset: 5%; overflow: hidden; white-space: pre-wrap;
      overflow-wrap: break-word; font: 18px/1.5 system-ui; }
    h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -.02em; }
    .menu-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .editor-controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 5px; }
    .editor-controls > button, .editor-controls select { width: 100%; min-width: 0; min-height: 36px; height: 100%; font-size: 13px; }
    .editor-controls > button { padding: 4px; }
    .editor-controls select { max-width: none; padding-inline: 6px; }
    .editor-controls .status { grid-column: 4 / 6; align-self: center; text-align: right; }
    .page-picker, .menu-label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    select { font: inherit; color: inherit; max-width: min(220px, 55vw); min-height: 42px;
      border: 1px solid #8796a9; border-radius: 8px; background: #fff; }
    button { min-height: 42px; }
    .menu-button { background: #e9eff9; }
    dialog.menu { width: min(92vw, 520px); max-width: none; padding: 20px; border: 1px solid #dce0e7;
      border-radius: 16px; color: inherit; box-shadow: 0 12px 40px #17213930; }
    dialog::backdrop { background: #17213955; }
    .menu h2 { margin: 0 0 10px; font-size: 19px; }
    .menu section { padding: 12px 0; border-top: 1px solid #a6b2c1; }
    .menu h3 { margin: 0 0 7px; font-size: 15px; }
    .menu .menu-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); align-items: stretch; }
    .menu .menu-actions > * { min-width: 0; }
    .menu .menu-actions button { text-align: left; }
    .menu .menu-label { display: grid; gap: 6px; }
    .menu .menu-label select { width: 100%; max-width: none; }
    .menu > .menu-actions + section { margin-top: 12px; }
    .context { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-top: 3px; }
    .context strong { overflow-wrap: anywhere; }
    .context span { font-size: 13px; color: #526278; overflow-wrap: anywhere; }
    .folder-icon { display: inline-block; width: 1.15em; height: .9em; margin-right: .35em;
      vertical-align: -.05em; background: var(--folder-color, #d39b35);
      clip-path: polygon(0 0, 40% 0, 51% 22%, 100% 22%, 100% 100%, 0 100%); }
    #libraryMenu { width: min(92vw, 460px); max-height: 90dvh; padding: 12px; }
    .folder-toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .folder-navigation { justify-content: space-between; margin-top: 8px; }
    #newFolder { margin-left: auto; }
    #folderPath { flex: 1; margin: 0; overflow-wrap: anywhere; min-width: 4em; }
    .folder-list { display: grid; margin: 6px 0; }
    .folder-list button { text-align: left; overflow-wrap: anywhere; border: 0;
      border-bottom: 1px solid #dce2ec; border-radius: 0; background: transparent; }
    #folderActions { position: relative; }
    #folderActions summary { cursor: pointer; padding: 8px 12px; list-style: none; }
    #folderActions summary::-webkit-details-marker { display: none; }
    .folder-action-list { position: absolute; right: 0; z-index: 1; display: grid; gap: 4px;
      min-width: 145px; padding: 6px; background: white; border: 1px solid #dce2ec; border-radius: 8px; }
    #libraryNotes > summary { cursor: pointer; padding: 8px 0; }
    .context [hidden] { display: none; }
    .menu footer { margin-top: 12px; text-align: right; }
    .danger { color: #a32525; }
    #surveyPanel { width: min(100%, 800px); margin: 0 auto 12px; padding: 10px 12px;
      background: #fff; border: 1px solid #dce0e7; border-radius: 9px; }
    #surveyPanel summary { cursor: pointer; font-weight: 600; font-size: 14px; }
    #surveySummary { width: min(100%, 800px); margin: 0 auto 12px; }
    button { font: inherit; font-size: 14px; border: 1px solid #8796a9; background: #f7f8fb; border-radius: 9px; padding: 9px 12px; color: inherit; cursor: pointer; }
    button:hover { background: #eaf0fa; }
    button:focus-visible { outline: 3px solid #73aaf2; outline-offset: 2px; }
    button[aria-pressed="true"] { background: #1675d1; border-color: #1675d1; color: #fff; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .right { margin-left: auto; }
    .status { font-size: 12px; color: #657083; }
    main { max-width: 1050px; margin: 20px auto 42px; padding: 0 16px; }
    .paper { position: relative; width: min(100%, 800px); aspect-ratio: 8 / 11; margin: 0 auto; background-color: white; border: 1px solid #d7dce6; border-radius: 3px; box-shadow: 0 10px 28px #1c26321c; overflow: hidden; }
    .sheet.landscape { width: 100%; }
    .paper.landscape { aspect-ratio: 11 / 8; }
    .paper.landscape.grid { background-size: 2.272727% 3.125%; }
    .sheet-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .sheet-heading .sheet-title { margin: 0; }
    .drawing-focus .header-inner h1, .drawing-focus .context,
    .drawing-focus #surveyPanel, .drawing-focus #surveySummary,
    .drawing-focus .sheet:not(.active-drawing-sheet),
    .drawing-focus .sheet-title, .drawing-focus .sheet-orientation,
    .drawing-focus .editor-controls > :not([data-tool="pen"], [data-tool="eraser"], [data-tool="rectangle"], #undo) { display: none; }
    .drawing-focus .editor-controls { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .drawing-focus main { max-width: none; margin-block: 4px; }
    .drawing-focus .sheet { width: min(100%, max(220px, calc((100dvh - var(--header-height, 52px) - 60px) * 8 / 11))); }
    .drawing-focus .sheet.landscape { width: min(100%, max(300px, calc((100dvh - var(--header-height, 52px) - 60px) * 11 / 8))); }
    .drawing-focus .sheet-heading { justify-content: flex-end; margin-bottom: 4px; }
    .drawing-focus .sheet-lock { min-height: 32px; padding: 4px 8px; }
    .paper.grid { background-image: linear-gradient(#b6d0ee55 1px, transparent 1px), linear-gradient(90deg, #b6d0ee55 1px, transparent 1px); background-size: 3.125% 2.272727%; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    #ink, #preview { touch-action: none; }
    #preview { pointer-events: none; }
    #pagePhoto { position: absolute; left: 50%; top: 50%; width: 65%; pointer-events: none; }
    #pageText { position: absolute; inset: 5%; width: 90%; height: 90%; resize: none;
      border: 0; padding: 0; background: transparent; font: 18px/1.5 system-ui; pointer-events: none; }
    #pageText.editing { z-index: 2; pointer-events: auto; outline: 2px solid #73aaf2; }
    #surveyFields { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; padding: 8px 0; }
    #surveyFields label { display: grid; gap: 4px; grid-column: span 6; min-width: 0; color: #174b99; }
    #surveyFields .field-full { grid-column: 1 / -1; }
    #surveyFields .field-wide { grid-column: span 8; }
    #surveyFields .field-short { grid-column: span 4; }
    #surveyFields .field-last-row { grid-column: 1 / span 6; }
    #surveyFields input { min-width: 0; font: inherit; color: #000; }
    #surveySummary { white-space: pre-wrap; overflow-wrap: anywhere; }
    dialog { max-width: min(90vw, 480px); }
    dialog label { display: block; margin: 8px 0; }
    dialog label[hidden] { display: none; }
    @media (max-width: 500px) { .header-inner { padding: calc(6px + env(safe-area-inset-top)) 11px 6px; } h1 { font-size: 17px; } button { font-size: 13px; padding: 8px 10px; } main { margin-top: 12px; padding: 0 11px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>CadernoWeb</h1>
      <div class="context" aria-live="polite">
        <strong id="location"></strong>
        <span id="folderLocation"></span>
        <span id="clientLocation" hidden></span>
      </div>
      <dialog class="menu" id="libraryMenu" aria-labelledby="libraryTitle">
        <h2 id="libraryTitle">Pastas e notas</h2>
        <div class="folder-toolbar">
          <h3 id="folderPath"></h3>
          <details id="folderActions" hidden>
            <summary aria-label="Ações da pasta">⋯</summary>
            <div class="folder-action-list">
              <button type="button" id="renameFolder">Renomear</button>
              <button type="button" id="changeFolderColor">Mudar cor</button>
              <button type="button" id="deleteFolder" class="danger">Excluir pasta</button>
            </div>
          </details>
        </div>
        <div id="folderList" class="folder-list" aria-label="Pastas deste nível"></div>
        <details id="libraryNotes">
          <summary>Notas desta pasta</summary>
          <section>
            <label class="menu-label">Nota <select id="noteSelect"></select></label>
            <div class="menu-actions">
              <button type="button" id="newNote">Nova nota</button>
              <button type="button" id="renameNote">Renomear nota</button>
              <button type="button" id="moveNote">Mover nota</button>
              <button type="button" id="deleteNote" class="danger">Excluir nota</button>
            </div>
          </section>
        </details>
        <div class="folder-toolbar folder-navigation">
          <button type="button" id="parentFolder" hidden>Voltar</button>
          <button type="button" id="newFolder">Nova pasta</button>
        </div>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <dialog class="menu" id="folderDialog" aria-labelledby="folderDialogTitle">
        <h2 id="folderDialogTitle">Nova pasta</h2>
        <form id="folderForm" method="dialog">
          <label id="folderNameLabel">Nome <input id="folderName" required></label>
          <label>Cor <select id="folderColor"></select></label>
          <button type="submit" value="cancel" formnovalidate>Cancelar</button>
          <button type="submit" id="saveFolder" value="save">Criar pasta</button>
        </form>
      </dialog>
      <dialog id="moveDialog">
        <form method="dialog">
          <label>Pasta de destino <select id="moveDestination"></select></label>
          <button value="cancel">Cancelar</button>
          <button id="confirmMove" value="move">Mover</button>
        </form>
      </dialog>
      <dialog id="pageDialog">
        <form method="dialog">
          <label>Tipo de folha
            <select id="newPageStyle">
              <option value="grid">Quadriculado</option>
              <option value="blank">Em branco</option>
              <option value="objects">Eletrodomésticos/Objetos</option>
            </select>
          </label>
          <button value="cancel">Cancelar</button>
          <label id="newPageOrientationLabel">Orientação
            <select id="newPageOrientation">
              <option value="portrait">Vertical</option>
              <option value="landscape">Horizontal</option>
            </select>
          </label>
          <button id="confirmPage" value="create">Criar folha</button>
        </form>
      </dialog>
      <div class="editor-controls" role="group" aria-label="Controles do caderno">
        <button type="button" class="menu-button" data-menu="libraryMenu">Cadernos</button>
        <label class="page-picker"><select id="pageSelect" aria-label="Ir para folha"></select></label>
        <button type="button" id="deletePage" class="danger">Excluir folha</button>
        <button type="button" id="newPage">Nova folha</button>
        <button type="button" data-menu="backupMenu">Backup</button>
        <button type="button" data-tool="pen" aria-pressed="true">Caneta</button>
        <button type="button" data-tool="eraser" aria-pressed="false">Borracha</button>
        <button type="button" data-tool="rectangle" aria-pressed="false">Retângulo</button>
        <button type="button" data-tool="hand" aria-pressed="false">Navegar</button>
        <button type="button" id="undo" disabled>Voltar</button>
        <button type="button" id="editText" aria-pressed="false">Digitar</button>
        <button type="button" data-menu="photoMenu" data-needs-page>Foto</button>
        <button type="button" data-menu="paperMenu" data-needs-page>Papel e cores</button>
        <div class="status">
          <span id="status" aria-live="polite">Carregando…</span>
          <button type="button" id="syncButton" data-menu="syncDialog" hidden>Conta</button>
          <span id="syncStatus" role="status"></span>
        </div>
      </div>
      <dialog class="menu" id="photoMenu" aria-labelledby="photoTitle">
        <h2 id="photoTitle">Foto da folha</h2>
        <div class="menu-actions">
          <button type="button" id="addPhoto">Adicionar foto</button>
          <button type="button" id="takePhoto">Câmera</button>
          <button type="button" id="adjustPhoto">Ajustar foto</button>
        </div>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <dialog class="menu" id="paperMenu" aria-labelledby="paperTitle">
        <h2 id="paperTitle">Papel e cores</h2>
        <div class="menu-actions">
          <button type="button" id="paperToggle">Papel: quadriculado</button>
          <label class="menu-label">Tinta <input type="color" id="inkColor" value="#18232d"></label>
          <label class="menu-label">Cor do papel <input type="color" id="paperColor" value="#ffffff"></label>
        </div>
        <section>
          <h3>Conteúdo da folha</h3>
          <div class="menu-actions">
            <button type="button" id="clear" class="danger">Limpar desenho</button>
          </div>
        </section>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <dialog class="menu" id="syncDialog" aria-labelledby="syncTitle">
        <h2 id="syncTitle">Sincronização</h2>
        <p id="syncDialogStatus" role="status"></p>
        <form id="syncLogin">
          <label>E-mail <input name="email" type="email" autocomplete="username" required></label>
          <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
          <button>Entrar</button>
        </form>
        <p id="syncEmail"></p>
        <div id="syncConflict" hidden>
          <p>Há duas versões. Exporte o backup deste aparelho para guardar uma cópia antes de escolher.</p>
          <button type="button" id="syncUseLocal">Enviar versão deste aparelho</button>
          <button type="button" id="syncUseCloud">Baixar versão da nuvem</button>
        </div>
        <button type="button" id="syncLogout" hidden>Sair</button>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <dialog class="menu" id="backupMenu" aria-labelledby="backupTitle">
        <h2 id="backupTitle">Backup</h2>
        <div class="menu-actions">
          <button type="button" id="exportBackup">Exportar backup</button>
          <button type="button" id="restoreBackup">Restaurar backup</button>
        </div>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <input type="file" id="photoFile" accept="image/*" hidden>
      <input type="file" id="cameraFile" accept="image/*" capture="environment" hidden>
      <input type="file" id="backupFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <details id="surveyPanel">
      <summary>Dados do levantamento</summary>
      <div id="surveyFields"></div>
      <button type="button" id="addField">Adicionar campo</button>
    </details>
    <p id="surveySummary" hidden></p>
    <dialog id="photoDialog">
      <form method="dialog">
        <label>Tamanho <input id="photoScale" type="range" min="25" max="200"></label>
        <label>Largura <input id="photoWidth" type="range" min="25" max="200"></label>
        <label>Altura <input id="photoHeight" type="range" min="25" max="200"></label>
        <label>Posição horizontal <input id="photoX" type="range" min="-50" max="50"></label>
        <label>Posição vertical <input id="photoY" type="range" min="-50" max="50"></label>
        <button value="cancel">Cancelar</button>
        <button id="savePhoto" value="save">Salvar ajuste</button>
        <button id="removePhoto" value="remove">Remover foto</button>
      </form>
    </dialog>
    <div id="sheetList" class="sheet-list"></div>
    <section id="paper" hidden class="paper grid" aria-label="Folha de desenho">
      <img id="pagePhoto" alt="Foto da folha" hidden>
      <textarea id="pageText" aria-label="Texto da folha" readonly spellcheck="true" inputmode="text" autocapitalize="sentences" tabindex="-1"></textarea>
      <canvas id="ink" width="800" height="1100" aria-label="Área de desenho"></canvas>
      <canvas id="preview" width="800" height="1100" aria-hidden="true"></canvas>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const W = 800, H = 1100;
      const STORAGE_KEY = 'cadernoweb-prototipo-1';
      const paper = document.querySelector('#paper');
      const canvas = document.querySelector('#ink');
      const preview = document.querySelector('#preview');
      const ctx = canvas.getContext('2d');
      const pctx = preview.getContext('2d');
      const status = document.querySelector('#status');
      const undoButton = document.querySelector('#undo');
      const noteSelect = document.querySelector('#noteSelect');
      const pageSelect = document.querySelector('#pageSelect');
      const renameNote = document.querySelector('#renameNote');
      const moveNote = document.querySelector('#moveNote');
      const newPage = document.querySelector('#newPage');
      const locationLabel = document.querySelector('#location');
      const control = id => document.getElementById(id);
      const pageText = control('pageText');
      const pagePhoto = control('pagePhoto');
      const objectsTitle = 'Eletrodomésticos/Objetos';
      const objectColumns = [['name', 'Objeto'], ['width', 'Larg'], ['height', 'Alt'],
        ['depth', 'Prof'], ['room', 'Ambiente']];
      const surveyLabels = ['Cliente', 'CPF', 'RG', 'E-mail', 'Telefone', 'Endereço',
        'Número', 'Cidade', 'CEP', 'Bairro', 'Complemento', 'Ambiente', 'Data'];
      let tool = 'pen';
      let library = initialLibrary();
      let folderIndex = -1;
      let noteIndex = 0;
      let pageIndex = 0;
      let page = library.notes[0].pages[0];
      let actions = page.actions;
      let current = null;
      let pointerId = null;
      let drawingFocus = false;
      let savedContent;
      let localReadFailed = false;
      let syncState = { owner: null, revision: 0, dirty: false };

      function initialLibrary(firstPage = { actions: [], paperStyle: 'grid' }) {
        return { folders: [], notes: [{ title: 'Meu caderno', folder: -1, pages: [firstPage] }] };
      }

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          if (validLibrary(saved)) {
            library = saved;
            noteIndex = Number.isInteger(saved.noteIndex) && saved.notes[saved.noteIndex] ? saved.noteIndex : 0;
            folderIndex = saved.notes[noteIndex]?.folder ?? -1;
            pageIndex = saved.notes[noteIndex]?.pages[saved.pageIndex] ? Number(saved.pageIndex) : 0;
          } else if (Array.isArray(saved.actions)) {
            library = initialLibrary({
              actions: saved.actions.filter(validAction),
              paperStyle: saved.paperStyle === 'blank' ? 'blank' : 'grid'
            });
          } else if (Object.keys(saved).length) {
            throw new Error('Caderno local inválido');
          }
          savedContent = JSON.stringify(notebookData(library));
          syncState = saved.sync ?? {
            owner: null, revision: 0,
            dirty: savedContent !== JSON.stringify(initialLibrary())
          };
        } catch {
          localReadFailed = true;
          status.textContent = 'Não foi possível ler os dados salvos';
          return;
        }
        showSelection();
        status.textContent = 'Pronto';
      }

      function notebookData(value) {
        return {
          folders: value.folders, notes: value.notes,
          ...(value.gridColors && { gridColors: value.gridColors })
        };
      }

      function persist(nextLibrary = library, nextNote = noteIndex, nextPage = pageIndex, syncedState) {
        try {
          if (localReadFailed) throw new Error('Caderno local inválido');
          const content = notebookData(nextLibrary);
          const serialized = JSON.stringify(content);
          const changed = serialized !== savedContent;
          const nextSync = syncedState ?? { ...syncState, dirty: syncState.dirty || changed };
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            ...content, noteIndex: nextNote, pageIndex: nextPage, sync: nextSync
          }));
          savedContent = serialized;
          syncState = nextSync;
          status.textContent = 'Salvo neste navegador';
          if (!syncedState && changed && session) {
            syncStatus(navigator.onLine ? 'Sincronização pendente' : 'Offline · alterações salvas no aparelho');
            scheduleSync();
          }
          return true;
        } catch {
          status.textContent = 'Não foi possível salvar neste navegador';
          return false;
        }
      }

      function setOptions(select, entries, selected) {
        select.replaceChildren(...entries.map(([label, value]) => new Option(label, String(value))));
        select.value = String(selected);
      }

      const folderColors = {
        '': ['Sem cor', ''], blue: ['Azul', '🔵'], red: ['Vermelho', '🔴'],
        green: ['Verde', '🟢'], yellow: ['Amarelo', '🟡'], purple: ['Roxo', '🟣'],
        orange: ['Laranja', '🟠']
      };

      function paintFolderIcon(icon, folder) {
        const colors = { blue: '#3275cc', red: '#d44343', green: '#33834e',
          yellow: '#d5a318', purple: '#8356bd', orange: '#da7425' };
        icon.style.setProperty('--folder-color', colors[folder?.color] ?? '#d39b35');
      }

      function folderPath(index) {
        const names = [];
        for (let folder = library.folders[index]; folder; folder = library.folders[folder.parent]) {
          names.unshift(folder.name);
        }
        return names.join(' / ');
      }

      function openFolder(index) {
        select(index, library.notes.findIndex(note => note.folder === index));
        persist();
      }

      function showFolders() {
        const folder = library.folders[folderIndex];
        const parentButton = control('parentFolder');
        parentButton.hidden = !folder;
        control('folderActions').hidden = !folder;
        control('folderActions').open = false;
        const heading = control('folderPath');
        heading.textContent = folder?.name ?? 'Pastas';
        if (folder) {
          const icon = document.createElement('span');
          icon.className = 'folder-icon';
          icon.setAttribute('aria-hidden', 'true');
          paintFolderIcon(icon, folder);
          heading.prepend(icon);
        }
        const list = control('folderList');
        list.replaceChildren();
        library.folders.forEach((child, index) => {
          if (child.parent !== folderIndex) return;
          const button = document.createElement('button');
          button.type = 'button';
          const icon = document.createElement('span');
          icon.className = 'folder-icon';
          icon.setAttribute('aria-hidden', 'true');
          paintFolderIcon(icon, child);
          button.append(icon, child.name);
          button.addEventListener('click', () => {
            openFolder(index);
            parentButton.focus();
          });
          list.append(button);
        });
      }

      function showSelection() {
        const note = library.notes[noteIndex];
        page = note?.pages[pageIndex];
        actions = page?.actions ?? [];
        const drawingPage = !!page && !page.objects;
        if (pointerId !== null && canvas.hasPointerCapture(pointerId)) {
          canvas.releasePointerCapture(pointerId);
        }
        current = null;
        pointerId = null;

        showFolders();
        const notes = library.notes.flatMap((item, i) => item.folder === folderIndex ? [[item.title, i]] : []);
        setOptions(noteSelect, notes.length ? notes : [['Nenhuma nota', -1]], noteIndex);
        setOptions(pageSelect, note ? note.pages.map((sheet, i) => [sheet.objects ? `Folha ${i + 1} · Objetos` : `Folha ${i + 1}`, i]) : [], pageIndex);
        noteSelect.disabled = pageSelect.disabled = renameNote.disabled = moveNote.disabled = newPage.disabled = !note;
        document.querySelector('#paperToggle').disabled = document.querySelector('#clear').disabled = !drawingPage;
        document.querySelectorAll('[data-needs-page]').forEach(button => { button.disabled = !drawingPage; });
        paper.hidden = !drawingPage;
        if (!drawingPage) setDrawingFocus(false);
        locationLabel.textContent = note?.title ?? 'Nenhuma nota';
        const folder = library.folders[folderIndex];
        const folderLocation = control('folderLocation');
        folderLocation.replaceChildren();
        if (folder) {
          const icon = document.createElement('span');
          icon.className = 'folder-icon';
          icon.setAttribute('aria-hidden', 'true');
          paintFolderIcon(icon, folder);
          folderLocation.append(icon, folderPath(folderIndex));
        } else {
          folderLocation.textContent = 'Sem pasta';
        }
        setTextEditing(false);
        pageText.value = page?.text ?? '';
        for (const id of ['editText', 'addPhoto', 'takePhoto', 'inkColor', 'paperColor']) control(id).disabled = !drawingPage;
        control('deletePage').disabled = !note || note.pages.length < 2;
        control('deleteNote').disabled = !note;
        control('renameFolder').disabled = control('deleteFolder').disabled = control('changeFolderColor').disabled = folderIndex < 0;
        control('surveyPanel').hidden = !note;
        showPhoto();
        showSurvey();
        updatePaper();
        updateUndo();
        redraw();
        showSheets(note);
      }

      function showSheets(note) {
        const list = control('sheetList');
        if (!note) {
          list.replaceChildren();
          return;
        }

        const sheets = note.pages.map((sheet, index) => {
          const section = document.createElement('section');
          section.className = 'sheet';
          section.dataset.sheetIndex = String(index);
          const title = document.createElement('h2');
          title.className = 'sheet-title';
          title.textContent = `Folha ${index + 1}`;
          section.append(title);
          if (sheet.objects) {
            title.textContent = objectsTitle;
            section.append(buildObjectsSheet(sheet, index));
            return section;
          }
          section.classList.toggle('landscape', sheet.orientation === 'landscape');
          if (index === pageIndex) {
            section.classList.add('active-drawing-sheet');
            const heading = document.createElement('div');
            heading.className = 'sheet-heading';
            const orientation = document.createElement('button');
            orientation.type = 'button';
            orientation.className = 'sheet-orientation';
            const landscape = sheet.orientation === 'landscape';
            orientation.textContent = landscape ? 'Folha vertical' : 'Folha horizontal';
            orientation.addEventListener('click', () => {
              if (savePage({ ...sheet, orientation: landscape ? 'portrait' : 'landscape' })) scrollToSheet();
            });
            const lock = document.createElement('button');
            lock.type = 'button';
            lock.className = 'sheet-lock';
            lock.textContent = drawingFocus ? 'Destravar folha' : 'Travar folha';
            lock.addEventListener('click', () => {
              setDrawingFocus(!drawingFocus);
              lock.textContent = drawingFocus ? 'Destravar folha' : 'Travar folha';
              if (drawingFocus) window.scrollTo(0, 0);
              else scrollToSheet();
            });
            heading.append(title, orientation, lock);
            section.append(heading, paper);
            return section;
          }

          const previewButton = document.createElement('button');
          previewButton.type = 'button';
          previewButton.className = 'paper sheet-preview';
          previewButton.classList.toggle('landscape', sheet.orientation === 'landscape');
          previewButton.classList.toggle('grid', sheet.paperStyle === 'grid');
          previewButton.style.backgroundColor = drawingColor(sheet, 'paperColor');
          previewButton.setAttribute('aria-label', `Editar folha ${index + 1}`);
          const activateSheet = () => {
            const previousTop = section.getBoundingClientRect().top;
            select(folderIndex, noteIndex, index);
            window.scrollBy(0, paper.parentElement.getBoundingClientRect().top - previousTop);
            persist();
          };
          previewButton.addEventListener('pointerdown', event => {
            if (tool === 'hand' || !pageText.readOnly || pointerId !== null || event.button !== 0) return;
            activateSheet();
            beginDrawing(event);
          });
          previewButton.addEventListener('click', () => {
            if (pointerId !== null) return;
            const editing = !pageText.readOnly;
            activateSheet();
            if (editing) {
              setTextEditing(true);
              pageText.focus({ preventScroll: true });
            }
          });

          if (sheet.photo) {
            const photo = document.createElement('img');
            photo.alt = '';
            applyPhoto(photo, sheet.photo);
            previewButton.append(photo);
          }
          if (sheet.text) {
            const text = document.createElement('span');
            text.className = 'sheet-preview-text';
            text.textContent = sheet.text;
            previewButton.append(text);
          }
          if (sheet.actions.length) {
            const drawing = document.createElement('canvas');
            drawing.width = sheet.orientation === 'landscape' ? H : W;
            drawing.height = sheet.orientation === 'landscape' ? W : H;
            const context = drawing.getContext('2d');
            sheet.actions.forEach(action => drawAction(context, action));
            previewButton.append(drawing);
          }
          section.append(previewButton);
          return section;
        });
        list.replaceChildren(...sheets);
        updatePreviewGestures();
      }

      function buildObjectsSheet(sheet, index) {
        const active = index === pageIndex;
        const wrapper = document.createElement('div');
        wrapper.className = 'objects-sheet';
        const table = document.createElement('table');
        table.className = 'objects-table';
        table.setAttribute('aria-label', objectsTitle);
        const headings = table.createTHead().insertRow();
        for (const [, label] of objectColumns) {
          const heading = document.createElement('th');
          heading.scope = 'col';
          heading.textContent = label;
          headings.append(heading);
        }
        const body = table.createTBody();
        const appendRow = (item, rowIndex) => {
          const row = body.insertRow();
          for (const [key, label] of objectColumns) {
            const cell = row.insertCell();
            if (!active) {
              const value = document.createElement('span');
              value.textContent = item[key];
              cell.append(value);
              continue;
            }
            const input = document.createElement('input');
            input.value = item[key];
            input.setAttribute('aria-label', `${label}, linha ${rowIndex + 1}`);
            if (['width', 'height', 'depth'].includes(key)) input.inputMode = 'decimal';
            input.addEventListener('input', () => {
              item[key] = input.value;
              persist();
            });
            cell.append(input);
          }
          return row;
        };
        sheet.objects.forEach(appendRow);
        wrapper.append(table);
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = active ? 'Adicionar linha' : 'Editar objetos';
        button.addEventListener('click', () => {
          if (!active) {
            select(folderIndex, noteIndex, index);
            scrollToSheet();
            persist();
            return;
          }
          const item = emptyObjectRow();
          sheet.objects.push(item);
          if (!persist()) {
            sheet.objects.pop();
            return;
          }
          appendRow(item, sheet.objects.length - 1).querySelector('input').focus();
        });
        wrapper.append(button);
        return wrapper;
      }

      function emptyObjectRow() {
        return { name: '', width: '', height: '', depth: '', room: '' };
      }

      function scrollToSheet() {
        document.querySelector(`[data-sheet-index="${pageIndex}"]`)?.scrollIntoView({ block: 'start' });
      }

      function select(nextFolder, nextNote, nextPage = 0) {
        folderIndex = nextFolder;
        noteIndex = nextNote;
        pageIndex = nextPage;
        showSelection();
      }

      function saveLibrary(next, folder, note, sheet = 0) {
        if (!persist(next, note, sheet)) {
          showSelection();
          return false;
        }
        library = next;
        select(folder, note, sheet);
        return true;
      }

      async function exportBackup() {
        const exportedAt = new Date().toISOString();
        const backup = { app: 'CadernoWeb', version: 2, exportedAt, ...notebookData(library) };
        const filename = `cadernoweb-backup-${exportedAt.replace(/[:.]/g, '-')}.json`;
        let downloadUrl;
        try {
          const file = new File([JSON.stringify(backup)], filename, { type: 'application/json' });
          const shareData = { files: [file] };
          if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
            try {
              await navigator.share(shareData);
              return;
            } catch (error) {
              if (error.name === 'AbortError') return;
            }
          }

          downloadUrl = URL.createObjectURL(file);
          const link = document.createElement('a');
          link.href = downloadUrl;
          link.download = filename;
          document.body.appendChild(link);
          try {
            link.click();
          } finally {
            link.remove();
          }
        } catch {
          status.textContent = 'Não foi possível exportar o backup';
        } finally {
          if (downloadUrl) setTimeout(() => URL.revokeObjectURL(downloadUrl), 30000);
        }
      }

      function validAction(action) {
        if (!action || !validColor(action.color)) return false;
        if (action.kind === 'rectangle') {
          return [action.x, action.y, action.w, action.h].every(Number.isFinite)
            && action.w >= 0 && action.h >= 0;
        }
        return ['pen', 'eraser'].includes(action.kind)
          && Array.isArray(action.points) && action.points.length > 0
          && action.points.every(point => Array.isArray(point)
            && point.length === 2 && point.every(Number.isFinite));
      }

      async function restoreBackup(file) {
        let backup;
        try {
          backup = JSON.parse(await file.text());
        } catch {
          status.textContent = 'Não foi possível ler o arquivo de backup';
          return;
        }

        const legacy = backup?.app === 'CadernoWeb' && backup.version === 1 && validPage(backup);
        const complete = backup?.app === 'CadernoWeb' && backup.version === 2 && validLibrary(backup);
        if (!legacy && !complete) {
          status.textContent = 'Arquivo de backup inválido ou incompatível';
          return;
        }

        if (legacy && page?.objects) {
          status.textContent = 'Selecione uma folha de desenho para restaurar este backup';
          return;
        }

        if (legacy && page) {
          if (!confirm('Substituir o desenho e o papel da folha atual pelo backup?')) return;
          const pages = library.notes[noteIndex].pages.slice();
          pages[pageIndex] = { actions: backup.actions, paperStyle: backup.paperStyle };
          if (!saveLibrary(withNote({ ...library.notes[noteIndex], pages }), folderIndex, noteIndex, pageIndex)) return;
        } else if (legacy) {
          if (!confirm('Criar uma nota com a folha deste backup?')) return;
          const note = { title: 'Nota restaurada', folder: folderIndex,
            pages: [{ actions: backup.actions, paperStyle: backup.paperStyle }] };
          if (!saveLibrary({ ...library, notes: [...library.notes, note] }, folderIndex, library.notes.length)) return;
        } else {
          if (!confirm('Substituir todas as pastas, notas e folhas pelo conteúdo deste backup?')) return;
          const next = notebookData(backup);
          if (!saveLibrary(next, next.notes[0]?.folder ?? -1, next.notes.length ? 0 : -1)) return;
        }
        status.textContent = 'Backup restaurado e salvo neste navegador';
      }

      function validColor(value) {
        return value === undefined || (typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value));
      }

      function validPhoto(photo) {
        return photo == null || (typeof photo.data === 'string'
          && /^data:image\/jpeg;base64,[a-z0-9+/]+=*$/i.test(photo.data)
          && [photo.scale, photo.width, photo.height].every(value => Number.isFinite(value) && value >= 25 && value <= 200)
          && [photo.x, photo.y].every(value => Number.isFinite(value) && Math.abs(value) <= 50));
      }

      function validPage(value) {
        return value && ['blank', 'grid'].includes(value.paperStyle)
          && Array.isArray(value.actions) && value.actions.every(validAction)
          && (value.text === undefined || typeof value.text === 'string')
          && (value.objects === undefined || (Array.isArray(value.objects)
            && value.objects.every(item => item && objectColumns.every(([key]) => typeof item[key] === 'string'))))
          && validColor(value.paperColor) && validColor(value.inkColor) && validPhoto(value.photo);
      }

      function validLibrary(value) {
        return value && Array.isArray(value.folders) && Array.isArray(value.notes)
          && (value.gridColors === undefined || (value.gridColors && typeof value.gridColors === 'object'
            && !Array.isArray(value.gridColors) && validColor(value.gridColors.inkColor)
            && validColor(value.gridColors.paperColor)))
          && value.folders.every((folder, i) => folder && typeof folder.name === 'string'
            && Number.isInteger(folder.parent) && folder.parent >= -1 && folder.parent < i)
          && value.notes.every(note => note && typeof note.title === 'string'
            && Number.isInteger(note.folder) && note.folder >= -1 && note.folder < value.folders.length
            && (note.survey === undefined || (Array.isArray(note.survey)
              && note.survey.every(field => field && typeof field.label === 'string' && typeof field.value === 'string')))
            && Array.isArray(note.pages) && note.pages.length > 0 && note.pages.every(validPage));
      }

      function withNote(note) {
        const notes = library.notes.slice();
        notes[noteIndex] = note;
        return { ...library, notes };
      }

      function updatePreviewGestures() {
        const drawing = tool !== 'hand' && pageText.readOnly;
        document.querySelectorAll('.sheet-preview').forEach(button => {
          button.style.touchAction = drawing ? 'none' : 'pan-y';
        });
      }

      function setTextEditing(editing) {
        pageText.readOnly = !editing;
        updatePreviewGestures();
        pageText.classList.toggle('editing', editing);
        control('editText').setAttribute('aria-pressed', String(editing));
        control('editText').textContent = editing ? 'Concluir texto' : 'Digitar';
        pageText.tabIndex = editing ? 0 : -1;
        if (!editing && document.activeElement === pageText) pageText.blur();
      }

      function surveyFields() {
        const saved = library.notes[noteIndex]?.survey ?? [];
        const fields = saved.map(field => field.label === 'Data do levantamento'
          ? { ...field, label: 'Data' } : field);
        const standard = surveyLabels.map(label => fields.find(field => field.label === label)
          ?? { label, value: '' });
        const extras = fields.filter((field, index) => !surveyLabels.includes(field.label)
          || fields.findIndex(item => item.label === field.label) !== index);
        return [...standard.slice(0, -2), ...extras, ...standard.slice(-2)];
      }

      function showSurveySummary() {
        const fields = surveyFields();
        const client = control('clientLocation');
        const clientName = fields.find(field => field.label === 'Cliente')?.value.trim();
        client.textContent = clientName ?? '';
        client.hidden = !clientName;
        const summary = control('surveySummary');
        summary.textContent = fields.filter(field => field.value.trim())
          .map(field => `${field.label}: ${field.value}`).join(' · ');
        summary.hidden = !page || pageIndex !== 0 || !summary.textContent;
      }

      function showSurvey() {
        const container = control('surveyFields');
        container.replaceChildren();
        showSurveySummary();
        if (!page) return;
        surveyFields().forEach((field, i) => {
          const label = document.createElement('label');
          const input = document.createElement('input');
          label.textContent = field.label;
          if (field.label === 'Cliente') label.className = 'field-full';
          if (['E-mail', 'Endereço', 'Cidade'].includes(field.label)) label.className = 'field-wide';
          if (['Telefone', 'CEP', 'Número'].includes(field.label)) label.className = 'field-short';
          if (field.label === 'Ambiente') label.className = 'field-last-row';
          input.value = field.value;
          input.addEventListener('input', () => {
            const note = library.notes[noteIndex];
            const survey = surveyFields().slice();
            survey[i] = { label: field.label, value: input.value };
            note.survey = survey;
            showSurveySummary();
            persist();
          });
          label.append(input);
          container.append(label);
        });
      }

      function showPhoto() {
        const photo = page?.photo;
        pagePhoto.hidden = !photo;
        control('adjustPhoto').disabled = !photo;
        if (!photo) {
          pagePhoto.removeAttribute('src');
          return;
        }
        applyPhoto(pagePhoto, photo);
      }

      function applyPhoto(image, photo) {
        image.src = photo.data;
        image.style.transform = `translate(-50%, -50%) scale(${photo.scale * photo.width / 10000}, ${photo.scale * photo.height / 10000})`;
        image.style.left = `${50 + photo.x}%`;
        image.style.top = `${50 + photo.y}%`;
      }

      function savePage(nextPage) {
        const note = library.notes[noteIndex];
        const pages = note.pages.slice();
        pages[pageIndex] = nextPage;
        return saveLibrary(withNote({ ...note, pages }), folderIndex, noteIndex, pageIndex);
      }

      async function loadPhoto(input) {
        const file = input.files[0];
        input.value = '';
        if (!file || !page) return;
        const target = page;
        const url = URL.createObjectURL(file);
        try {
          const image = new Image();
          image.src = url;
          await image.decode();
          if (page !== target) return;
          const scale = Math.min(1, 1200 / Math.max(image.naturalWidth, image.naturalHeight));
          const buffer = document.createElement('canvas');
          buffer.width = Math.max(1, Math.round(image.naturalWidth * scale));
          buffer.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = buffer.getContext('2d');
          context.fillStyle = '#fff';
          context.fillRect(0, 0, buffer.width, buffer.height);
          context.drawImage(image, 0, 0, buffer.width, buffer.height);
          const data = buffer.toDataURL('image/jpeg', 0.75);
          if (!data.startsWith('data:image/jpeg;base64,')) throw Error('Foto inválida');
          savePage({ ...target, photo: { data, scale: 100, width: 100, height: 100, x: 0, y: 0 } });
        } catch {
          status.textContent = 'Não foi possível abrir a foto';
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      function updateUndo() { undoButton.disabled = actions.length === 0; }
      function setDrawingFocus(enabled) {
        drawingFocus = enabled;
        document.body.classList.toggle('drawing-focus', enabled);
        if (enabled) {
          if (tool === 'hand') setTool('pen');
          else setTextEditing(false);
        }
      }

      function drawingColor(sheet, key) {
        const shared = sheet?.paperStyle === 'grid' ? library.gridColors?.[key] : undefined;
        return shared ?? sheet?.[key] ?? (key === 'inkColor' ? '#18232d' : '#ffffff');
      }

      function updatePaper() {
        const landscape = page?.orientation === 'landscape';
        paper.classList.toggle('landscape', landscape);
        for (const layer of [canvas, preview]) {
          const width = landscape ? H : W;
          const height = landscape ? W : H;
          if (layer.width !== width) layer.width = width;
          if (layer.height !== height) layer.height = height;
        }
        const grid = page?.paperStyle !== 'blank';
        paper.classList.toggle('grid', grid);
        control('inkColor').value = drawingColor(page, 'inkColor');
        control('paperColor').value = drawingColor(page, 'paperColor');
        paper.style.backgroundColor = control('paperColor').value;
        document.querySelector('#paperToggle').textContent = grid ? 'Papel: quadriculado' : 'Papel: em branco';
      }

      function drawAction(target, action) {
        if (!action) return;
        const scaleX = target.canvas.width / W;
        const scaleY = target.canvas.height / H;
        target.save();
        target.lineCap = 'round';
        target.lineJoin = 'round';
        if (action.kind === 'rectangle') {
          target.strokeStyle = action.color ?? '#17202a'; target.lineWidth = 2.7;
          const {x, y, w, h} = action;
          target.strokeRect(x * scaleX, y * scaleY, w * scaleX, h * scaleY);
        } else {
          target.globalCompositeOperation = action.kind === 'eraser' ? 'destination-out' : 'source-over';
          target.strokeStyle = action.kind === 'eraser' ? '#000' : (action.color ?? '#18232d');
          target.lineWidth = action.kind === 'eraser' ? 22 : 2.8;
          const pts = action.points || [];
          if (pts.length) {
            target.beginPath();
            target.moveTo(pts[0][0] * scaleX, pts[0][1] * scaleY);
            if (pts.length === 1) {
              target.lineTo(pts[0][0] * scaleX + .01, pts[0][1] * scaleY + .01);
            } else {
              for (let i = 1; i < pts.length; i++) {
                const [x, y] = pts[i];
                target.lineTo(x * scaleX, y * scaleY);
              }
            }
            target.stroke();
          }
        }
        target.restore();
      }

      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const a of actions) drawAction(ctx, a);
        if (current && current.kind !== 'rectangle') drawAction(ctx, current);
        pctx.clearRect(0, 0, preview.width, preview.height);
        if (current && current.kind === 'rectangle') drawAction(pctx, current);
      }

      function point(e) {
        const b = canvas.getBoundingClientRect();
        return [Math.max(0, Math.min(W, (e.clientX - b.left) * W / b.width)),
                Math.max(0, Math.min(H, (e.clientY - b.top) * H / b.height))];
      }
      function syncRectangle(a, x, y) {
        a.x = Math.min(a.startX, x); a.y = Math.min(a.startY, y);
        a.w = Math.abs(x - a.startX); a.h = Math.abs(y - a.startY);
      }
      function setTool(next) {
        tool = next;
        setTextEditing(false);
        document.querySelectorAll('[data-tool]').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.tool === next)));
        canvas.style.pointerEvents = next === 'hand' ? 'none' : 'auto';
        canvas.style.touchAction = next === 'hand' ? 'auto' : 'none';
        canvas.style.cursor = next === 'hand' ? 'default' : next === 'eraser' ? 'cell' : 'crosshair';
        current = null; pointerId = null; redraw();
      }

      function beginDrawing(e) {
        if (!page || tool === 'hand' || pointerId !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
        e.preventDefault();
        pointerId = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        const [x, y] = point(e);
        current = tool === 'rectangle'
          ? { kind: 'rectangle', startX: x, startY: y, x, y, w: 0, h: 0 }
          : { kind: tool, points: [[x, y]] };
        const ink = drawingColor(page, 'inkColor');
        if (ink !== '#18232d' || tool !== 'rectangle' || page.inkColor
          || (page.paperStyle === 'grid' && library.gridColors?.inkColor)) current.color = ink;
        status.textContent = 'Desenhando…';
        redraw();
      }
      canvas.addEventListener('pointerdown', beginDrawing);
      canvas.addEventListener('pointermove', e => {
        if (!current || e.pointerId !== pointerId) return;
        e.preventDefault();
        const events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
        for (const ev of events.length ? events : [e]) {
          const [x, y] = point(ev);
          if (current.kind === 'rectangle') syncRectangle(current, x, y);
          else {
            const isPencilStroke = current.kind === 'pen' && e.pointerType === 'pen';
            if (isPencilStroke && ev.pressure === 0) continue;
            const last = current.points[current.points.length - 1];
            const minimumMove = isPencilStroke && current.points.length === 1 ? 3 : .65;
            if (Math.hypot(x - last[0], y - last[1]) > minimumMove) current.points.push([x, y]);
          }
        }
        redraw();
      });
      function finish(e, cancelled) {
        if (!current || e.pointerId !== pointerId) return;
        e.preventDefault();
        if (!cancelled) {
          const [x, y] = point(e);
          if (current.kind === 'rectangle') syncRectangle(current, x, y);
          else if (current.kind !== 'pen' || e.pointerType !== 'pen') current.points.push([x, y]);
          const a = current;
          if (a.kind !== 'rectangle' || a.w >= 3 || a.h >= 3) {
            if (a.kind === 'rectangle') { delete a.startX; delete a.startY; }
            actions.push(a);
          }
        }
        current = null;
        if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
        pointerId = null;
        redraw(); updateUndo(); persist();
      }
      canvas.addEventListener('pointerup', e => finish(e, false));
      canvas.addEventListener('pointercancel', e => finish(e, true));
      document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
      undoButton.addEventListener('click', () => { if (!actions.length) return; actions.pop(); redraw(); updateUndo(); persist(); });
      document.querySelector('#paperToggle').addEventListener('click', () => {
        page.paperStyle = page.paperStyle === 'grid' ? 'blank' : 'grid';
        updatePaper();
        persist();
      });
      control('folderActions').addEventListener('click', event => {
        if (event.target.closest('button')) control('folderActions').open = false;
      });

      control('parentFolder').addEventListener('click', () => {
        openFolder(library.folders[folderIndex]?.parent ?? -1);
        const focusTarget = folderIndex < 0 ? control('folderList').firstElementChild ?? control('newFolder') : control('parentFolder');
        focusTarget.focus();
      });
      noteSelect.addEventListener('change', () => {
        select(folderIndex, Number(noteSelect.value));
        persist();
      });
      pageSelect.addEventListener('change', () => {
        select(folderIndex, noteIndex, Number(pageSelect.value));
        scrollToSheet();
        persist();
      });
      const folderDialog = control('folderDialog');
      let editingFolderColor = false;

      function openFolderDialog(editColor) {
        editingFolderColor = editColor;
        const folder = library.folders[folderIndex];
        control('folderDialogTitle').textContent = editColor ? 'Cor da pasta' : folder ? 'Nova subpasta' : 'Nova pasta';
        control('folderNameLabel').hidden = editColor;
        control('folderName').disabled = editColor;
        control('folderName').value = '';
        control('saveFolder').textContent = editColor ? 'Salvar cor' : 'Criar pasta';
        setOptions(control('folderColor'), Object.entries(folderColors).map(([value, [label, marker]]) =>
          [marker ? marker + ' ' + label : label, value]), editColor ? folder.color ?? '' : '');
        folderDialog.showModal();
      }

      control('newFolder').addEventListener('click', () => openFolderDialog(false));
      control('changeFolderColor').addEventListener('click', () => openFolderDialog(true));
      control('folderForm').addEventListener('submit', event => {
        if (event.submitter?.value === 'cancel') return;
        event.preventDefault();
        const color = control('folderColor').value;
        const folders = library.folders.slice();
        if (editingFolderColor) {
          folders[folderIndex] = { ...folders[folderIndex], color };
          if (saveLibrary({ ...library, folders }, folderIndex, noteIndex, pageIndex)) folderDialog.close();
          return;
        }
        const name = control('folderName').value.trim();
        if (!name) {
          control('folderName').focus();
          return;
        }
        folders.push({ name, parent: folderIndex, color });
        if (saveLibrary({ ...library, folders }, folders.length - 1, -1)) folderDialog.close();
      });
      document.querySelector('#newNote').addEventListener('click', () => {
        const title = prompt('Nome da nova nota', 'Nova nota')?.trim();
        if (!title) return;
        const note = { title, folder: folderIndex, pages: [{ actions: [], paperStyle: 'grid' }] };
        saveLibrary({ ...library, notes: [...library.notes, note] }, folderIndex, library.notes.length);
      });
      renameNote.addEventListener('click', () => {
        const note = library.notes[noteIndex];
        const title = prompt('Nome da nota', note.title)?.trim();
        if (title) saveLibrary(withNote({ ...note, title }), folderIndex, noteIndex, pageIndex);
      });
      moveNote.addEventListener('click', () => {
        setOptions(document.querySelector('#moveDestination'),
          [['Sem pasta', -1], ...library.folders.map((_, index) => [folderPath(index), index])], folderIndex);
        document.querySelector('#moveDialog').showModal();
      });
      document.querySelector('#confirmMove').addEventListener('click', event => {
        const folder = Number(document.querySelector('#moveDestination').value);
        if (!saveLibrary(withNote({ ...library.notes[noteIndex], folder }), folder, noteIndex, pageIndex)) {
          event.preventDefault();
        }
      });
      control('newPageStyle').addEventListener('change', event => {
        control('newPageOrientationLabel').hidden = event.target.value === 'objects';
      });
      newPage.addEventListener('click', () => {
        document.querySelector('#pageDialog').showModal();
      });
      document.querySelector('#confirmPage').addEventListener('click', event => {
        const style = document.querySelector('#newPageStyle').value;
        const sheet = { actions: [], paperStyle: style === 'grid' ? 'grid' : 'blank' };
        if (style === 'objects') sheet.objects = Array.from({ length: 8 }, emptyObjectRow);
        else if (control('newPageOrientation').value === 'landscape') sheet.orientation = 'landscape';
        const note = library.notes[noteIndex];
        const pages = [...note.pages, sheet];
        if (!saveLibrary(withNote({ ...note, pages }), folderIndex, noteIndex, pages.length - 1)) {
          event.preventDefault();
          return;
        }
        requestAnimationFrame(scrollToSheet);
      });
      document.querySelectorAll('[data-menu]').forEach(button => {
        button.addEventListener('click', () => control(button.dataset.menu).showModal());
      });
      control('exportBackup').addEventListener('click', () => {
        control('backupMenu').close();
        exportBackup();
      });
      control('editText').addEventListener('click', () => {
        const editing = pageText.readOnly;
        setTextEditing(editing);
        if (editing) pageText.focus({ preventScroll: true });
      });
      pageText.addEventListener('input', () => {
        page.text = pageText.value;
        persist();
      });
      for (const key of ['inkColor', 'paperColor']) {
        control(key).addEventListener('change', event => {
          if (!page || page.objects) return;
          const color = event.target.value;
          if (page.paperStyle === 'grid') {
            saveLibrary({ ...library, gridColors: { ...library.gridColors, [key]: color } },
              folderIndex, noteIndex, pageIndex);
          } else {
            savePage({ ...page, [key]: color });
          }
        });
      }
      control('addField').addEventListener('click', () => {
        const label = prompt('Nome do campo')?.trim();
        if (!label) return;
        saveLibrary(withNote({ ...library.notes[noteIndex], survey: [...surveyFields(), { label, value: '' }] }),
          folderIndex, noteIndex, pageIndex);
      });
      control('addPhoto').addEventListener('click', () => { control('photoMenu').close(); control('photoFile').click(); });
      control('takePhoto').addEventListener('click', () => { control('photoMenu').close(); control('cameraFile').click(); });
      for (const id of ['photoFile', 'cameraFile']) control(id).addEventListener('change', event => loadPhoto(event.target));
      const photoControls = { scale: 'photoScale', width: 'photoWidth', height: 'photoHeight', x: 'photoX', y: 'photoY' };
      control('adjustPhoto').addEventListener('click', () => {
        for (const [key, id] of Object.entries(photoControls)) control(id).value = page.photo[key];
        control('photoMenu').close();
        control('photoDialog').showModal();
      });
      control('savePhoto').addEventListener('click', event => {
        const photo = { ...page.photo };
        for (const [key, id] of Object.entries(photoControls)) photo[key] = Number(control(id).value);
        if (!savePage({ ...page, photo })) event.preventDefault();
      });
      control('removePhoto').addEventListener('click', event => {
        if (!confirm('Remover a foto desta folha?') || !savePage({ ...page, photo: null })) event.preventDefault();
      });
      control('renameFolder').addEventListener('click', () => {
        const folder = library.folders[folderIndex];
        const name = prompt('Nome da pasta', folder.name)?.trim();
        if (!name) return;
        const folders = library.folders.slice();
        folders[folderIndex] = { ...folder, name };
        saveLibrary({ ...library, folders }, folderIndex, noteIndex, pageIndex);
      });
      control('deleteFolder').addEventListener('click', () => {
        const removed = new Set([folderIndex]);
        library.folders.forEach((folder, i) => {
          if (removed.has(folder.parent)) removed.add(i);
        });
        if (!confirm('Excluir esta pasta, suas subpastas e as notas que elas contêm?')) return;
        const newIndexes = new Map();
        const folders = library.folders.flatMap((folder, i) => {
          if (removed.has(i)) return [];
          newIndexes.set(i, newIndexes.size);
          return [{ ...folder, parent: newIndexes.get(folder.parent) ?? -1 }];
        });
        const notes = library.notes.filter(note => !removed.has(note.folder))
          .map(note => ({ ...note, folder: newIndexes.get(note.folder) ?? -1 }));
        saveLibrary({ ...library, folders, notes }, -1, notes.findIndex(note => note.folder === -1));
      });
      control('deleteNote').addEventListener('click', () => {
        if (!confirm('Excluir esta nota e todas as suas folhas?')) return;
        const notes = library.notes.filter((_, i) => i !== noteIndex);
        saveLibrary({ ...library, notes }, folderIndex, notes.findIndex(note => note.folder === folderIndex));
      });
      control('deletePage').addEventListener('click', () => {
        if (!confirm('Excluir esta folha?')) return;
        const note = library.notes[noteIndex];
        const pages = note.pages.filter((_, i) => i !== pageIndex);
        saveLibrary(withNote({ ...note, pages }), folderIndex, noteIndex, Math.min(pageIndex, pages.length - 1));
      });

      const backupFile = document.querySelector('#backupFile');
      const restoreButton = document.querySelector('#restoreBackup');
      restoreButton.addEventListener('click', () => {
        control('backupMenu').close();
        backupFile.click();
      });
      backupFile.addEventListener('change', async () => {
        const file = backupFile.files[0];
        backupFile.value = '';
        if (!file) return;

        restoreButton.disabled = true;
        try {
          await restoreBackup(file);
        } finally {
          restoreButton.disabled = false;
        }
      });
      document.querySelector('#clear').addEventListener('click', () => {
        if (actions.length && !confirm('Limpar todos os desenhos desta folha?')) return;
        actions.length = 0; current = null; redraw(); updateUndo(); persist();
      });
      document.addEventListener('keydown', e => {
        if (e.target.closest('dialog, input, select, textarea')) return;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault(); if (actions.length) { actions.pop(); redraw(); updateUndo(); persist(); }
        }
      });
      const syncConfig = { url: 'https://vhdaaqajitufcumajisy.supabase.co', publishableKey: 'sb_publishable_JXPOuq9aQqQ7CTvO7qWplA_-p6ob-IJ' };
      const sessionKey = STORAGE_KEY + '-session';
      let session;
      let syncTimer;
      let syncing = false;
      let accountBusy = false;
      let syncConflict = null;

      function syncStatus(message) {
        control('syncStatus').textContent = message;
        control('syncDialogStatus').textContent = message;
      }

      function showAccount() {
        control('syncLogin').hidden = !!session;
        control('syncLogout').hidden = !session;
        control('syncEmail').textContent = session?.user.email ?? '';
        control('syncConflict').hidden = !syncConflict;
        control('syncLogin').querySelector('button').disabled = accountBusy || syncing;
        control('syncLogout').disabled = accountBusy || syncing;
      }

      async function syncRequest(path, { token, body } = {}) {
        const headers = { apikey: syncConfig.publishableKey };
        if (token) headers.Authorization = 'Bearer ' + token;
        if (body) headers['Content-Type'] = 'application/json';
        const response = await fetch(syncConfig.url + path, {
          method: body ? 'POST' : 'GET',
          headers,
          body: body ? JSON.stringify(body) : undefined,
          cache: 'no-store',
          signal: AbortSignal.timeout?.(30000)
        });
        if (!response.ok) {
          const error = new Error('Falha de comunicação');
          error.status = response.status;
          throw error;
        }
        return response.json();
      }

      function saveSession(value) {
        localStorage.setItem(sessionKey, JSON.stringify(value));
        session = value;
        showAccount();
      }

      async function accessToken() {
        if (session.expires_at > Date.now() / 1000 + 60) return session.access_token;
        try {
          const refreshed = await syncRequest('/auth/v1/token?grant_type=refresh_token', {
            body: { refresh_token: session.refresh_token }
          });
          if (refreshed.user.id !== session.user.id) throw new Error('Conta divergente');
          saveSession(refreshed);
          return refreshed.access_token;
        } catch (error) {
          if ([400, 401, 403].includes(error.status)) saveSession(null);
          throw error;
        }
      }

      function scheduleSync(delay = 1200) {
        clearTimeout(syncTimer);
        if (session && !syncConflict) syncTimer = setTimeout(syncNotebook, delay);
      }

      function useRemote(remote, owner) {
        const next = remote.notebook;
        const sheet = next.notes[noteIndex]?.pages[pageIndex] ? pageIndex : 0;
        const note = next.notes[noteIndex] ? noteIndex : (next.notes.length ? 0 : -1);
        if (!persist(next, note, sheet, { owner, revision: remote.revision, dirty: false })) return false;
        library = next;
        select(next.notes[note]?.folder ?? -1, note, sheet);
        return true;
      }

      function canonicalJson(value) {
        return JSON.stringify(value, (_, item) => {
          if (!item || typeof item !== 'object' || Array.isArray(item)) return item;
          return Object.fromEntries(Object.keys(item).sort().map(key => [key, item[key]]));
        });
      }

      async function syncNotebook(choice) {
        if (!session || syncing || accountBusy || localReadFailed || !navigator.onLine || (syncConflict && !choice)) return;
        syncing = true;
        showAccount();
        syncStatus('Sincronizando…');
        try {
          const owner = session.user.id;
          if (syncState.owner && syncState.owner !== owner) {
            syncStatus('Este caderno está vinculado a outra conta.');
            return;
          }
          const token = await accessToken();
          const rows = await syncRequest('/rest/v1/cadernoweb_notebooks?select=revision,notebook', { token });
          const remote = rows[0];
          if (remote && (!Number.isSafeInteger(remote.revision) || !validLibrary(remote.notebook))) {
            throw new Error('Caderno remoto inválido');
          }
          if (choice && remote?.revision !== syncConflict?.revision) choice = undefined;
          const local = notebookData(library);
          const snapshot = JSON.stringify(local);
          if (snapshot !== savedContent) {
            syncStatus('Há alterações que ainda não foram salvas no aparelho.');
            return;
          }
          if (current || (!choice && document.activeElement?.matches('textarea, #surveyFields input, .objects-table input'))) {
            syncStatus('Sincronização pendente');
            return;
          }
          if (remote && (canonicalJson(local) === canonicalJson(notebookData(remote.notebook)))) {
            if (!persist(library, noteIndex, pageIndex, { owner, revision: remote.revision, dirty: false })) throw new Error();
          } else if (remote && (choice === 'cloud' || !syncState.dirty)) {
            if (!useRemote(remote, owner)) throw new Error();
          } else {
            const revision = remote?.revision ?? 0;
            if (remote && revision !== syncState.revision && choice !== 'local') {
              syncConflict = { revision };
              syncStatus('Há duas versões do caderno.');
              return;
            }
            const nextRevision = await syncRequest('/rest/v1/rpc/cadernoweb_save_notebook', {
              token, body: { expected_revision: revision, new_notebook: local }
            });
            if (!Number.isSafeInteger(nextRevision)) {
              syncConflict = null;
              syncStatus('A nuvem mudou. Conferindo novamente…');
              return;
            }
            const dirty = JSON.stringify(notebookData(library)) !== snapshot;
            if (!persist(library, noteIndex, pageIndex, { owner, revision: nextRevision, dirty })) throw new Error();
          }
          syncConflict = null;
          syncStatus(syncState.dirty ? 'Sincronização pendente' : 'Sincronizado');
        } catch {
          syncStatus(session ? 'Sincronização pendente. O caderno está neste aparelho.' : 'Entre novamente para sincronizar.');
        } finally {
          syncing = false;
          showAccount();
        }
      }

      function initSync() {
        if (!syncConfig.url || !syncConfig.publishableKey) return;
        control('syncButton').hidden = false;
        try {
          session = JSON.parse(localStorage.getItem(sessionKey) || 'null');
        } catch {
          session = null;
        }
        showAccount();
        syncStatus(session ? 'Sincronização pendente' : 'Entre para sincronizar');
        control('syncLogin').addEventListener('submit', async event => {
          event.preventDefault();
          if (accountBusy || syncing) return;
          const form = event.currentTarget;
          accountBusy = true;
          showAccount();
          try {
            const credentials = { email: form.elements.email.value.trim(), password: form.elements.password.value };
            const signedIn = await syncRequest('/auth/v1/token?grant_type=password', { body: credentials });
            if (syncState.owner && syncState.owner !== signedIn.user.id) {
              syncStatus('Entre com a conta vinculada a este caderno.');
              return;
            }
            saveSession(signedIn);
            syncStatus('Sincronização pendente');
          } catch {
            syncStatus('Não foi possível entrar. Confira a conexão, o e-mail e a senha.');
          } finally {
            form.elements.password.value = '';
            accountBusy = false;
            showAccount();
            scheduleSync(0);
          }
        });
        control('syncLogout').addEventListener('click', () => {
          if (syncing || accountBusy) return;
          saveSession(null);
          syncConflict = null;
          showAccount();
          syncStatus('Entre para sincronizar');
        });
        control('syncUseLocal').addEventListener('click', () => {
          if (syncConflict && confirm('Substituir o caderno na nuvem pela versão deste aparelho?')) syncNotebook('local');
        });
        control('syncUseCloud').addEventListener('click', () => {
          if (syncConflict && confirm('Substituir o caderno deste aparelho pela versão da nuvem?')) syncNotebook('cloud');
        });
        window.addEventListener('online', () => scheduleSync(0));
        window.addEventListener('offline', () => { if (session) syncStatus('Offline · alterações salvas no aparelho'); });
        document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(0); });
        document.addEventListener('focusout', () => scheduleSync());
        setInterval(() => { if (!document.hidden) syncNotebook(); }, 15000);
        scheduleSync(0);
      }

      setTool('pen');
      showSelection();
      load();
      initSync();
      const header = document.querySelector('header');
      new ResizeObserver(() => {
        document.documentElement.style.setProperty('--header-height', `${header.offsetHeight}px`);
      }).observe(header);
    })();
  </script>
  <script>
    // O app funciona normalmente sem service worker durante os testes locais.
    // O cache offline é habilitado apenas em HTTPS ou localhost.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', {scope: './'})
          .catch(error => console.warn('Cache offline indisponível:', error));
      });
    }
  </script>
</body>
