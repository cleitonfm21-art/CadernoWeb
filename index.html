<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CadernoWeb">
  <meta name="description" content="Caderno de desenho com ferramentas para uso offline no iPad.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <title>CadernoWeb</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eff1f5; color: #1c2430; }
    header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #dce0e7; box-shadow: 0 2px 12px #1721390d; }
    .header-inner { max-width: 1050px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; margin: auto; }
    :root { scroll-padding-top: calc(var(--header-height, 205px) + 12px); }
    .sheet-list { display: grid; gap: 22px; }
    .sheet { width: min(100%, 800px); min-width: 0; margin-inline: auto; }
    .sheet-title { margin: 0 0 8px; font-size: 14px; color: #526278; }
    .sheet .paper { width: 100%; }
    button.sheet-preview { display: block; padding: 0; text-align: left; }
    .sheet-preview img, .sheet-preview-text { position: absolute; pointer-events: none; }
    .sheet-preview img { width: 65%; }
    .sheet-preview-text { inset: 5%; overflow: hidden; white-space: pre-wrap;
      overflow-wrap: break-word; font: 18px/1.5 system-ui; }
    h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -.02em; }
    .topbar, .tools, .options, .menu-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .topbar { justify-content: flex-end; }
    .topbar > button, .page-picker select { width: 116px; height: 44px; }
    .page-picker select { padding-inline: 10px; font-size: 14px; }
    .topbar h1 { margin-right: auto; }
    .tools { margin-top: 10px; }
    .options { margin-top: 8px; }
    .page-picker, .menu-label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    select { font: inherit; color: inherit; max-width: min(220px, 55vw); min-height: 42px;
      border: 1px solid #cdd4df; border-radius: 8px; background: #fff; }
    button, .options summary { min-height: 42px; }
    .menu-button { background: #e9eff9; }
    dialog.menu { width: min(92vw, 520px); max-width: none; padding: 20px; border: 1px solid #dce0e7;
      border-radius: 16px; color: inherit; box-shadow: 0 12px 40px #17213930; }
    dialog::backdrop { background: #17213955; }
    .menu h2 { margin: 0 0 10px; font-size: 19px; }
    .menu section { padding: 12px 0; border-top: 1px solid #e0e5ee; }
    .menu h3 { margin: 0 0 7px; font-size: 15px; }
    .menu .menu-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); align-items: stretch; }
    .menu .menu-actions > * { min-width: 0; }
    .menu .menu-actions button { text-align: left; }
    .menu .menu-label { display: grid; gap: 6px; }
    .menu .menu-label select { width: 100%; max-width: none; }
    .menu > .menu-actions + section { margin-top: 12px; }
    .context { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 8px; }
    .context strong { overflow-wrap: anywhere; }
    .context span { font-size: 13px; color: #526278; overflow-wrap: anywhere; }
    .context [hidden] { display: none; }
    .menu footer { margin-top: 12px; text-align: right; }
    .danger { color: #a32525; }
    #surveyPanel { width: min(100%, 800px); margin: 0 auto 12px; padding: 10px 12px;
      background: #fff; border: 1px solid #dce0e7; border-radius: 9px; }
    #surveyPanel summary { cursor: pointer; font-weight: 600; font-size: 14px; }
    #surveySummary { width: min(100%, 800px); margin: 0 auto 12px; }
    button { font: inherit; font-size: 14px; border: 1px solid #cdd4df; background: #f7f8fb; border-radius: 9px; padding: 9px 12px; color: inherit; cursor: pointer; }
    button:hover { background: #eaf0fa; }
    button:focus-visible { outline: 3px solid #73aaf2; outline-offset: 2px; }
    button[aria-pressed="true"] { background: #1675d1; border-color: #1675d1; color: #fff; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .right { margin-left: auto; }
    .status { font-size: 12px; color: #657083; }
    main { max-width: 1050px; margin: 20px auto 42px; padding: 0 16px; }
    .paper { position: relative; width: min(100%, 800px); aspect-ratio: 8 / 11; margin: 0 auto; background-color: white; border: 1px solid #d7dce6; border-radius: 3px; box-shadow: 0 10px 28px #1c26321c; overflow: hidden; }
    .paper.grid { background-image: linear-gradient(#b6d0ee55 1px, transparent 1px), linear-gradient(90deg, #b6d0ee55 1px, transparent 1px); background-size: 3.125% 2.272727%; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    #ink, #preview { touch-action: none; }
    #preview { pointer-events: none; }
    #pagePhoto { position: absolute; left: 50%; top: 50%; width: 65%; pointer-events: none; }
    #pageText { position: absolute; inset: 5%; width: 90%; height: 90%; resize: none;
      border: 0; padding: 0; background: transparent; font: 18px/1.5 system-ui; pointer-events: none; }
    #pageText.editing { z-index: 2; pointer-events: auto; outline: 2px solid #73aaf2; }
    #surveyFields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; padding: 8px 0; }
    #surveyFields label { display: grid; gap: 4px; }
    #surveyFields input { min-width: 0; font: inherit; }
    #surveySummary { white-space: pre-wrap; overflow-wrap: anywhere; }
    dialog { max-width: min(90vw, 480px); }
    dialog label { display: block; margin: 8px 0; }
    @media (max-width: 500px) { .header-inner { padding: calc(9px + env(safe-area-inset-top)) 11px 9px; } h1 { font-size: 17px; } button { font-size: 13px; padding: 8px 10px; } main { margin-top: 12px; padding: 0 11px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="topbar">
        <h1>CadernoWeb</h1>
        <button type="button" class="menu-button" data-menu="libraryMenu">Cadernos</button>
        <label class="page-picker"><select id="pageSelect" aria-label="Ir para folha"></select></label>
        <button type="button" id="newPage">Nova folha</button>
        <button type="button" data-menu="backupMenu">Backup</button>
      </div>
      <div class="context" aria-live="polite">
        <strong id="location"></strong>
        <span id="folderLocation"></span>
        <span id="clientLocation" hidden></span>
      </div>
      <dialog class="menu" id="libraryMenu" aria-labelledby="libraryTitle">
        <h2 id="libraryTitle">Pastas e notas</h2>
        <section>
          <label class="menu-label">Pasta <select id="folderSelect"></select></label>
          <div class="menu-actions">
            <button type="button" id="newFolder">Nova pasta</button>
            <button type="button" id="renameFolder">Renomear pasta</button>
            <button type="button" id="deleteFolder" class="danger">Excluir pasta</button>
          </div>
        </section>
        <section>
          <label class="menu-label">Nota <select id="noteSelect"></select></label>
          <div class="menu-actions">
            <button type="button" id="newNote">Nova nota</button>
            <button type="button" id="renameNote">Renomear nota</button>
            <button type="button" id="moveNote">Mover nota</button>
            <button type="button" id="deleteNote" class="danger">Excluir nota</button>
          </div>
        </section>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <dialog id="moveDialog">
        <form method="dialog">
          <label>Pasta de destino <select id="moveDestination"></select></label>
          <button value="cancel">Cancelar</button>
          <button id="confirmMove" value="move">Mover</button>
        </form>
      </dialog>
      <dialog id="pageDialog">
        <form method="dialog">
          <label>Papel da nova folha
            <select id="newPageStyle">
              <option value="grid">Quadriculado</option>
              <option value="blank">Em branco</option>
            </select>
          </label>
          <button value="cancel">Cancelar</button>
          <button id="confirmPage" value="create">Criar folha</button>
        </form>
      </dialog>
      <div class="tools" role="toolbar" aria-label="Ferramentas de desenho">
        <button type="button" data-tool="pen" aria-pressed="true">✏️ Caneta</button>
        <button type="button" data-tool="eraser" aria-pressed="false">◻ Borracha</button>
        <button type="button" data-tool="rectangle" aria-pressed="false">▭ Retângulo</button>
        <button type="button" data-tool="hand" aria-pressed="false">✋ Navegar</button>
        <button type="button" id="undo" class="right" disabled>↶ Voltar</button>
      </div>
      <div class="options" aria-label="Opções da folha">
        <button type="button" id="editText" aria-pressed="false">Digitar</button>
        <button type="button" data-menu="photoMenu" data-needs-page>Foto</button>
        <button type="button" data-menu="paperMenu" data-needs-page>Papel e cores</button>
        <span id="status" class="status right" aria-live="polite">Carregando…</span>
      </div>
      <dialog class="menu" id="photoMenu" aria-labelledby="photoTitle">
        <h2 id="photoTitle">Foto da folha</h2>
        <div class="menu-actions">
          <button type="button" id="addPhoto">Adicionar foto</button>
          <button type="button" id="takePhoto">Câmera</button>
          <button type="button" id="adjustPhoto">Ajustar foto</button>
        </div>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <dialog class="menu" id="paperMenu" aria-labelledby="paperTitle">
        <h2 id="paperTitle">Papel e cores</h2>
        <div class="menu-actions">
          <button type="button" id="paperToggle">Papel: quadriculado</button>
          <label class="menu-label">Tinta <input type="color" id="inkColor" value="#18232d"></label>
          <label class="menu-label">Cor do papel <input type="color" id="paperColor" value="#ffffff"></label>
        </div>
        <section>
          <h3>Conteúdo da folha</h3>
          <div class="menu-actions">
            <button type="button" id="clear" class="danger">Limpar desenho</button>
            <button type="button" id="deletePage" class="danger">Excluir folha</button>
          </div>
        </section>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <dialog class="menu" id="backupMenu" aria-labelledby="backupTitle">
        <h2 id="backupTitle">Backup</h2>
        <div class="menu-actions">
          <button type="button" id="exportBackup">Exportar backup</button>
          <button type="button" id="restoreBackup">Restaurar backup</button>
        </div>
        <footer><form method="dialog"><button>Voltar à folha</button></form></footer>
      </dialog>
      <input type="file" id="photoFile" accept="image/*" hidden>
      <input type="file" id="cameraFile" accept="image/*" capture="environment" hidden>
      <input type="file" id="backupFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <details id="surveyPanel">
      <summary>Dados do levantamento</summary>
      <div id="surveyFields"></div>
      <button type="button" id="addField">Adicionar campo</button>
    </details>
    <p id="surveySummary" hidden></p>
    <dialog id="photoDialog">
      <form method="dialog">
        <label>Tamanho <input id="photoScale" type="range" min="25" max="200"></label>
        <label>Largura <input id="photoWidth" type="range" min="25" max="200"></label>
        <label>Altura <input id="photoHeight" type="range" min="25" max="200"></label>
        <label>Posição horizontal <input id="photoX" type="range" min="-50" max="50"></label>
        <label>Posição vertical <input id="photoY" type="range" min="-50" max="50"></label>
        <button value="cancel">Cancelar</button>
        <button id="savePhoto" value="save">Salvar ajuste</button>
        <button id="removePhoto" value="remove">Remover foto</button>
      </form>
    </dialog>
    <div id="sheetList" class="sheet-list"></div>
    <section id="paper" hidden class="paper grid" aria-label="Folha de desenho">
      <img id="pagePhoto" alt="Foto da folha" hidden>
      <textarea id="pageText" aria-label="Texto da folha" readonly spellcheck="true" inputmode="text" autocapitalize="sentences" tabindex="-1"></textarea>
      <canvas id="ink" width="800" height="1100" aria-label="Área de desenho"></canvas>
      <canvas id="preview" width="800" height="1100" aria-hidden="true"></canvas>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const W = 800, H = 1100;
      const STORAGE_KEY = 'cadernoweb-prototipo-1';
      const paper = document.querySelector('#paper');
      const canvas = document.querySelector('#ink');
      const preview = document.querySelector('#preview');
      const ctx = canvas.getContext('2d');
      const pctx = preview.getContext('2d');
      const status = document.querySelector('#status');
      const undoButton = document.querySelector('#undo');
      const folderSelect = document.querySelector('#folderSelect');
      const noteSelect = document.querySelector('#noteSelect');
      const pageSelect = document.querySelector('#pageSelect');
      const renameNote = document.querySelector('#renameNote');
      const moveNote = document.querySelector('#moveNote');
      const newPage = document.querySelector('#newPage');
      const locationLabel = document.querySelector('#location');
      const control = id => document.getElementById(id);
      const pageText = control('pageText');
      const pagePhoto = control('pagePhoto');
      const surveyLabels = ['Cliente', 'RG', 'CPF', 'Telefone', 'E-mail', 'Endereço',
        'Número', 'Complemento', 'CEP', 'Bairro', 'Cidade', 'Ambiente', 'Data do levantamento'];
      let tool = 'pen';
      let library = initialLibrary();
      let folderIndex = -1;
      let noteIndex = 0;
      let pageIndex = 0;
      let page = library.notes[0].pages[0];
      let actions = page.actions;
      let current = null;
      let pointerId = null;

      function initialLibrary(firstPage = { actions: [], paperStyle: 'grid' }) {
        return { folders: [], notes: [{ title: 'Meu caderno', folder: -1, pages: [firstPage] }] };
      }

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          if (validLibrary(saved)) {
            library = saved;
            noteIndex = Number.isInteger(saved.noteIndex) && saved.notes[saved.noteIndex] ? saved.noteIndex : 0;
            folderIndex = saved.notes[noteIndex]?.folder ?? -1;
            pageIndex = saved.notes[noteIndex]?.pages[saved.pageIndex] ? Number(saved.pageIndex) : 0;
          } else if (Array.isArray(saved.actions)) {
            library = initialLibrary({
              actions: saved.actions.filter(validAction),
              paperStyle: saved.paperStyle === 'blank' ? 'blank' : 'grid'
            });
          }
        } catch {
          status.textContent = 'Não foi possível ler os dados salvos';
          return;
        }
        showSelection();
        status.textContent = 'Pronto';
      }

      function persist(nextLibrary = library, nextNote = noteIndex, nextPage = pageIndex) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            folders: nextLibrary.folders, notes: nextLibrary.notes,
            noteIndex: nextNote, pageIndex: nextPage
          }));
          status.textContent = 'Salvo neste navegador';
          return true;
        } catch {
          status.textContent = 'Não foi possível salvar neste navegador';
          return false;
        }
      }

      function setOptions(select, entries, selected) {
        select.replaceChildren(...entries.map(([label, value]) => new Option(label, String(value))));
        select.value = String(selected);
      }

      function folderOptions() {
        const children = new Map();
        library.folders.forEach((folder, index) => {
          if (!children.has(folder.parent)) children.set(folder.parent, []);
          children.get(folder.parent).push(index);
        });

        const options = [['Sem pasta', -1]];
        const pending = (children.get(-1) ?? []).map(index => [index, 0]).reverse();
        while (pending.length) {
          const [index, depth] = pending.pop();
          const prefix = depth ? '\u00a0\u00a0'.repeat(depth) + '↳ ' : '';
          options.push([prefix + library.folders[index].name, index]);
          const subfolders = children.get(index) ?? [];
          for (let i = subfolders.length - 1; i >= 0; i--) {
            pending.push([subfolders[i], depth + 1]);
          }
        }
        return options;
      }

      function showSelection() {
        const note = library.notes[noteIndex];
        page = note?.pages[pageIndex];
        actions = page?.actions ?? [];
        if (pointerId !== null && canvas.hasPointerCapture(pointerId)) {
          canvas.releasePointerCapture(pointerId);
        }
        current = null;
        pointerId = null;

        setOptions(folderSelect, folderOptions(), folderIndex);
        const notes = library.notes.flatMap((item, i) => item.folder === folderIndex ? [[item.title, i]] : []);
        setOptions(noteSelect, notes.length ? notes : [['Nenhuma nota', -1]], noteIndex);
        setOptions(pageSelect, note ? note.pages.map((_, i) => [`Folha ${i + 1}`, i]) : [], pageIndex);
        noteSelect.disabled = pageSelect.disabled = renameNote.disabled = moveNote.disabled = newPage.disabled = !note;
        document.querySelector('#paperToggle').disabled = document.querySelector('#clear').disabled = !page;
        document.querySelectorAll('[data-needs-page]').forEach(button => { button.disabled = !page; });
        paper.hidden = !page;
        locationLabel.textContent = note?.title ?? 'Nenhuma nota';
        const folder = library.folders[folderIndex];
        const parent = library.folders[folder?.parent];
        control('folderLocation').textContent = folder
          ? [parent?.name, folder.name].filter(Boolean).join(' › ')
          : 'Sem pasta';
        setTextEditing(false);
        pageText.value = page?.text ?? '';
        control('inkColor').value = page?.inkColor ?? '#18232d';
        control('paperColor').value = page?.paperColor ?? '#ffffff';
        for (const id of ['editText', 'addPhoto', 'takePhoto', 'inkColor', 'paperColor']) control(id).disabled = !page;
        control('deletePage').disabled = !note || note.pages.length < 2;
        control('deleteNote').disabled = !note;
        control('renameFolder').disabled = control('deleteFolder').disabled = folderIndex < 0;
        control('surveyPanel').hidden = !note;
        showPhoto();
        showSurvey();
        updatePaper();
        updateUndo();
        redraw();
        showSheets(note);
      }

      function showSheets(note) {
        const list = control('sheetList');
        if (!note) {
          list.replaceChildren();
          return;
        }

        const sheets = note.pages.map((sheet, index) => {
          const section = document.createElement('section');
          section.className = 'sheet';
          const title = document.createElement('h2');
          title.className = 'sheet-title';
          title.textContent = `Folha ${index + 1}`;
          section.append(title);
          if (index === pageIndex) {
            section.append(paper);
            return section;
          }

          const previewButton = document.createElement('button');
          previewButton.type = 'button';
          previewButton.className = 'paper sheet-preview';
          previewButton.classList.toggle('grid', sheet.paperStyle === 'grid');
          previewButton.style.backgroundColor = sheet.paperColor ?? '#fff';
          previewButton.setAttribute('aria-label', `Editar folha ${index + 1}`);
          previewButton.addEventListener('click', () => {
            const previousTop = section.getBoundingClientRect().top;
            select(folderIndex, noteIndex, index);
            window.scrollBy(0, paper.parentElement.getBoundingClientRect().top - previousTop);
            persist();
          });

          if (sheet.photo) {
            const photo = document.createElement('img');
            photo.alt = '';
            applyPhoto(photo, sheet.photo);
            previewButton.append(photo);
          }
          if (sheet.text) {
            const text = document.createElement('span');
            text.className = 'sheet-preview-text';
            text.textContent = sheet.text;
            previewButton.append(text);
          }
          if (sheet.actions.length) {
            const drawing = document.createElement('canvas');
            drawing.width = W;
            drawing.height = H;
            const context = drawing.getContext('2d');
            sheet.actions.forEach(action => drawAction(context, action));
            previewButton.append(drawing);
          }
          section.append(previewButton);
          return section;
        });
        list.replaceChildren(...sheets);
      }

      function select(nextFolder, nextNote, nextPage = 0) {
        folderIndex = nextFolder;
        noteIndex = nextNote;
        pageIndex = nextPage;
        showSelection();
      }

      function saveLibrary(next, folder, note, sheet = 0) {
        if (!persist(next, note, sheet)) {
          showSelection();
          return false;
        }
        library = next;
        select(folder, note, sheet);
        return true;
      }

      async function exportBackup() {
        const exportedAt = new Date().toISOString();
        const backup = { app: 'CadernoWeb', version: 2, exportedAt, folders: library.folders, notes: library.notes };
        const filename = `cadernoweb-backup-${exportedAt.replace(/[:.]/g, '-')}.json`;
        let downloadUrl;
        try {
          const file = new File([JSON.stringify(backup)], filename, { type: 'application/json' });
          const shareData = { files: [file] };
          if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
            try {
              await navigator.share(shareData);
              return;
            } catch (error) {
              if (error.name === 'AbortError') return;
            }
          }

          downloadUrl = URL.createObjectURL(file);
          const link = document.createElement('a');
          link.href = downloadUrl;
          link.download = filename;
          document.body.appendChild(link);
          try {
            link.click();
          } finally {
            link.remove();
          }
        } catch {
          status.textContent = 'Não foi possível exportar o backup';
        } finally {
          if (downloadUrl) setTimeout(() => URL.revokeObjectURL(downloadUrl), 30000);
        }
      }

      function validAction(action) {
        if (!action || !validColor(action.color)) return false;
        if (action.kind === 'rectangle') {
          return [action.x, action.y, action.w, action.h].every(Number.isFinite)
            && action.w >= 0 && action.h >= 0;
        }
        return ['pen', 'eraser'].includes(action.kind)
          && Array.isArray(action.points) && action.points.length > 0
          && action.points.every(point => Array.isArray(point)
            && point.length === 2 && point.every(Number.isFinite));
      }

      async function restoreBackup(file) {
        let backup;
        try {
          backup = JSON.parse(await file.text());
        } catch {
          status.textContent = 'Não foi possível ler o arquivo de backup';
          return;
        }

        const legacy = backup?.app === 'CadernoWeb' && backup.version === 1 && validPage(backup);
        const complete = backup?.app === 'CadernoWeb' && backup.version === 2 && validLibrary(backup);
        if (!legacy && !complete) {
          status.textContent = 'Arquivo de backup inválido ou incompatível';
          return;
        }

        if (legacy && page) {
          if (!confirm('Substituir o desenho e o papel da folha atual pelo backup?')) return;
          const pages = library.notes[noteIndex].pages.slice();
          pages[pageIndex] = { actions: backup.actions, paperStyle: backup.paperStyle };
          if (!saveLibrary(withNote({ ...library.notes[noteIndex], pages }), folderIndex, noteIndex, pageIndex)) return;
        } else if (legacy) {
          if (!confirm('Criar uma nota com a folha deste backup?')) return;
          const note = { title: 'Nota restaurada', folder: folderIndex,
            pages: [{ actions: backup.actions, paperStyle: backup.paperStyle }] };
          if (!saveLibrary({ ...library, notes: [...library.notes, note] }, folderIndex, library.notes.length)) return;
        } else {
          if (!confirm('Substituir todas as pastas, notas e folhas pelo conteúdo deste backup?')) return;
          const next = { folders: backup.folders, notes: backup.notes };
          if (!saveLibrary(next, next.notes[0]?.folder ?? -1, next.notes.length ? 0 : -1)) return;
        }
        status.textContent = 'Backup restaurado e salvo neste navegador';
      }

      function validColor(value) {
        return value === undefined || (typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value));
      }

      function validPhoto(photo) {
        return photo == null || (typeof photo.data === 'string'
          && /^data:image\/jpeg;base64,[a-z0-9+/]+=*$/i.test(photo.data)
          && [photo.scale, photo.width, photo.height].every(value => Number.isFinite(value) && value >= 25 && value <= 200)
          && [photo.x, photo.y].every(value => Number.isFinite(value) && Math.abs(value) <= 50));
      }

      function validPage(value) {
        return value && ['blank', 'grid'].includes(value.paperStyle)
          && Array.isArray(value.actions) && value.actions.every(validAction)
          && (value.text === undefined || typeof value.text === 'string')
          && validColor(value.paperColor) && validColor(value.inkColor) && validPhoto(value.photo);
      }

      function validLibrary(value) {
        return value && Array.isArray(value.folders) && Array.isArray(value.notes)
          && value.folders.every((folder, i) => folder && typeof folder.name === 'string'
            && Number.isInteger(folder.parent) && folder.parent >= -1 && folder.parent < i)
          && value.notes.every(note => note && typeof note.title === 'string'
            && Number.isInteger(note.folder) && note.folder >= -1 && note.folder < value.folders.length
            && (note.survey === undefined || (Array.isArray(note.survey)
              && note.survey.every(field => field && typeof field.label === 'string' && typeof field.value === 'string')))
            && Array.isArray(note.pages) && note.pages.length > 0 && note.pages.every(validPage));
      }

      function withNote(note) {
        const notes = library.notes.slice();
        notes[noteIndex] = note;
        return { ...library, notes };
      }

      function setTextEditing(editing) {
        pageText.readOnly = !editing;
        pageText.classList.toggle('editing', editing);
        control('editText').setAttribute('aria-pressed', String(editing));
        control('editText').textContent = editing ? 'Concluir texto' : 'Digitar';
        pageText.tabIndex = editing ? 0 : -1;
        if (!editing && document.activeElement === pageText) pageText.blur();
      }

      function surveyFields() {
        return library.notes[noteIndex]?.survey
          ?? surveyLabels.map(label => ({ label, value: '' }));
      }

      function showSurveySummary() {
        const fields = surveyFields();
        const client = control('clientLocation');
        const clientName = fields.find(field => field.label === 'Cliente')?.value.trim();
        client.textContent = clientName ?? '';
        client.hidden = !clientName;
        const summary = control('surveySummary');
        summary.textContent = fields.filter(field => field.value.trim())
          .map(field => `${field.label}: ${field.value}`).join(' · ');
        summary.hidden = !page || pageIndex !== 0 || !summary.textContent;
      }

      function showSurvey() {
        const container = control('surveyFields');
        container.replaceChildren();
        showSurveySummary();
        if (!page) return;
        surveyFields().forEach((field, i) => {
          const label = document.createElement('label');
          const input = document.createElement('input');
          label.textContent = field.label;
          input.value = field.value;
          input.addEventListener('input', () => {
            const note = library.notes[noteIndex];
            const survey = surveyFields().slice();
            survey[i] = { label: field.label, value: input.value };
            note.survey = survey;
            showSurveySummary();
            persist();
          });
          label.append(input);
          container.append(label);
        });
      }

      function showPhoto() {
        const photo = page?.photo;
        pagePhoto.hidden = !photo;
        control('adjustPhoto').disabled = !photo;
        if (!photo) {
          pagePhoto.removeAttribute('src');
          return;
        }
        applyPhoto(pagePhoto, photo);
      }

      function applyPhoto(image, photo) {
        image.src = photo.data;
        image.style.transform = `translate(-50%, -50%) scale(${photo.scale * photo.width / 10000}, ${photo.scale * photo.height / 10000})`;
        image.style.left = `${50 + photo.x}%`;
        image.style.top = `${50 + photo.y}%`;
      }

      function savePage(nextPage) {
        const note = library.notes[noteIndex];
        const pages = note.pages.slice();
        pages[pageIndex] = nextPage;
        return saveLibrary(withNote({ ...note, pages }), folderIndex, noteIndex, pageIndex);
      }

      async function loadPhoto(input) {
        const file = input.files[0];
        input.value = '';
        if (!file || !page) return;
        const target = page;
        const url = URL.createObjectURL(file);
        try {
          const image = new Image();
          image.src = url;
          await image.decode();
          if (page !== target) return;
          const scale = Math.min(1, 1200 / Math.max(image.naturalWidth, image.naturalHeight));
          const buffer = document.createElement('canvas');
          buffer.width = Math.max(1, Math.round(image.naturalWidth * scale));
          buffer.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = buffer.getContext('2d');
          context.fillStyle = '#fff';
          context.fillRect(0, 0, buffer.width, buffer.height);
          context.drawImage(image, 0, 0, buffer.width, buffer.height);
          const data = buffer.toDataURL('image/jpeg', 0.75);
          if (!data.startsWith('data:image/jpeg;base64,')) throw Error('Foto inválida');
          savePage({ ...target, photo: { data, scale: 100, width: 100, height: 100, x: 0, y: 0 } });
        } catch {
          status.textContent = 'Não foi possível abrir a foto';
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      function updateUndo() { undoButton.disabled = actions.length === 0; }
      function updatePaper() {
        const grid = page?.paperStyle !== 'blank';
        paper.classList.toggle('grid', grid);
        paper.style.backgroundColor = page?.paperColor ?? '#ffffff';
        document.querySelector('#paperToggle').textContent = grid ? 'Papel: quadriculado' : 'Papel: em branco';
      }

      function drawAction(target, action) {
        if (!action) return;
        target.save();
        target.lineCap = 'round';
        target.lineJoin = 'round';
        if (action.kind === 'rectangle') {
          target.strokeStyle = action.color ?? '#17202a'; target.lineWidth = 2.7;
          const {x, y, w, h} = action;
          target.strokeRect(x, y, w, h);
        } else {
          target.globalCompositeOperation = action.kind === 'eraser' ? 'destination-out' : 'source-over';
          target.strokeStyle = action.kind === 'eraser' ? '#000' : (action.color ?? '#18232d');
          target.lineWidth = action.kind === 'eraser' ? 22 : 2.8;
          const pts = action.points || [];
          if (pts.length) {
            target.beginPath();
            target.moveTo(pts[0][0], pts[0][1]);
            if (pts.length === 1) {
              target.lineTo(pts[0][0] + .01, pts[0][1] + .01);
            } else {
              for (let i=1; i<pts.length; i++) target.lineTo(pts[i][0], pts[i][1]);
            }
            target.stroke();
          }
        }
        target.restore();
      }

      function redraw() {
        ctx.clearRect(0, 0, W, H);
        for (const a of actions) drawAction(ctx, a);
        if (current && current.kind !== 'rectangle') drawAction(ctx, current);
        pctx.clearRect(0, 0, W, H);
        if (current && current.kind === 'rectangle') drawAction(pctx, current);
      }

      function point(e) {
        const b = canvas.getBoundingClientRect();
        return [Math.max(0, Math.min(W, (e.clientX - b.left) * W / b.width)),
                Math.max(0, Math.min(H, (e.clientY - b.top) * H / b.height))];
      }
      function syncRectangle(a, x, y) {
        a.x = Math.min(a.startX, x); a.y = Math.min(a.startY, y);
        a.w = Math.abs(x - a.startX); a.h = Math.abs(y - a.startY);
      }
      function setTool(next) {
        setTextEditing(false);
        tool = next;
        document.querySelectorAll('[data-tool]').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.tool === next)));
        canvas.style.pointerEvents = next === 'hand' ? 'none' : 'auto';
        canvas.style.touchAction = next === 'hand' ? 'auto' : 'none';
        canvas.style.cursor = next === 'hand' ? 'default' : next === 'eraser' ? 'cell' : 'crosshair';
        current = null; pointerId = null; redraw();
      }

      canvas.addEventListener('pointerdown', e => {
        if (!page || tool === 'hand' || pointerId !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
        e.preventDefault();
        pointerId = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        const [x, y] = point(e);
        current = tool === 'rectangle'
          ? { kind: 'rectangle', startX: x, startY: y, x, y, w: 0, h: 0 }
          : { kind: tool, points: [[x, y]] };
        if (page.inkColor) current.color = page.inkColor;
        status.textContent = 'Desenhando…';
        redraw();
      });
      canvas.addEventListener('pointermove', e => {
        if (!current || e.pointerId !== pointerId) return;
        e.preventDefault();
        const events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
        for (const ev of events.length ? events : [e]) {
          const [x, y] = point(ev);
          if (current.kind === 'rectangle') syncRectangle(current, x, y);
          else {
            const last = current.points[current.points.length-1];
            if (Math.hypot(x - last[0], y - last[1]) > .65) current.points.push([x, y]);
          }
        }
        redraw();
      });
      function finish(e, cancelled) {
        if (!current || e.pointerId !== pointerId) return;
        e.preventDefault();
        if (!cancelled) {
          const [x, y] = point(e);
          if (current.kind === 'rectangle') syncRectangle(current, x, y);
          else current.points.push([x, y]);
          const a = current;
          if (a.kind !== 'rectangle' || a.w >= 3 || a.h >= 3) {
            if (a.kind === 'rectangle') { delete a.startX; delete a.startY; }
            actions.push(a);
          }
        }
        current = null;
        if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
        pointerId = null;
        redraw(); updateUndo(); persist();
      }
      canvas.addEventListener('pointerup', e => finish(e, false));
      canvas.addEventListener('pointercancel', e => finish(e, true));
      document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
      undoButton.addEventListener('click', () => { if (!actions.length) return; actions.pop(); redraw(); updateUndo(); persist(); });
      document.querySelector('#paperToggle').addEventListener('click', () => {
        page.paperStyle = page.paperStyle === 'grid' ? 'blank' : 'grid';
        updatePaper();
        persist();
      });
      folderSelect.addEventListener('change', () => {
        const folder = Number(folderSelect.value);
        select(folder, library.notes.findIndex(note => note.folder === folder));
        persist();
      });
      noteSelect.addEventListener('change', () => {
        select(folderIndex, Number(noteSelect.value));
        persist();
      });
      pageSelect.addEventListener('change', () => {
        select(folderIndex, noteIndex, Number(pageSelect.value));
        paper.parentElement.scrollIntoView({ block: 'start' });
        persist();
      });
      document.querySelector('#newFolder').addEventListener('click', () => {
        const name = prompt('Nome da nova pasta')?.trim();
        if (!name) return;
        const folders = [...library.folders, { name, parent: folderIndex }];
        saveLibrary({ ...library, folders }, folders.length - 1, -1);
      });
      document.querySelector('#newNote').addEventListener('click', () => {
        const title = prompt('Nome da nova nota', 'Nova nota')?.trim();
        if (!title) return;
        const note = { title, folder: folderIndex, pages: [{ actions: [], paperStyle: 'grid' }] };
        saveLibrary({ ...library, notes: [...library.notes, note] }, folderIndex, library.notes.length);
      });
      renameNote.addEventListener('click', () => {
        const note = library.notes[noteIndex];
        const title = prompt('Nome da nota', note.title)?.trim();
        if (title) saveLibrary(withNote({ ...note, title }), folderIndex, noteIndex, pageIndex);
      });
      moveNote.addEventListener('click', () => {
        setOptions(document.querySelector('#moveDestination'),
          folderOptions(), folderIndex);
        document.querySelector('#moveDialog').showModal();
      });
      document.querySelector('#confirmMove').addEventListener('click', event => {
        const folder = Number(document.querySelector('#moveDestination').value);
        if (!saveLibrary(withNote({ ...library.notes[noteIndex], folder }), folder, noteIndex, pageIndex)) {
          event.preventDefault();
        }
      });
      newPage.addEventListener('click', () => {
        document.querySelector('#pageDialog').showModal();
      });
      document.querySelector('#confirmPage').addEventListener('click', event => {
        const paperStyle = document.querySelector('#newPageStyle').value;
        const note = library.notes[noteIndex];
        const pages = [...note.pages, { actions: [], paperStyle }];
        if (!saveLibrary(withNote({ ...note, pages }), folderIndex, noteIndex, pages.length - 1)) {
          event.preventDefault();
          return;
        }
        requestAnimationFrame(() => paper.parentElement.scrollIntoView({ block: 'start' }));
      });
      document.querySelectorAll('[data-menu]').forEach(button => {
        button.addEventListener('click', () => control(button.dataset.menu).showModal());
      });
      control('exportBackup').addEventListener('click', () => {
        control('backupMenu').close();
        exportBackup();
      });
      control('editText').addEventListener('click', () => {
        const editing = pageText.readOnly;
        setTextEditing(editing);
        if (editing) pageText.focus({ preventScroll: true });
      });
      pageText.addEventListener('input', () => {
        page.text = pageText.value;
        persist();
      });
      control('inkColor').addEventListener('change', event => {
        page.inkColor = event.target.value;
        persist();
      });
      control('paperColor').addEventListener('change', event => {
        page.paperColor = event.target.value;
        updatePaper();
        persist();
      });
      control('addField').addEventListener('click', () => {
        const label = prompt('Nome do campo')?.trim();
        if (!label) return;
        saveLibrary(withNote({ ...library.notes[noteIndex], survey: [...surveyFields(), { label, value: '' }] }),
          folderIndex, noteIndex, pageIndex);
      });
      control('addPhoto').addEventListener('click', () => { control('photoMenu').close(); control('photoFile').click(); });
      control('takePhoto').addEventListener('click', () => { control('photoMenu').close(); control('cameraFile').click(); });
      for (const id of ['photoFile', 'cameraFile']) control(id).addEventListener('change', event => loadPhoto(event.target));
      const photoControls = { scale: 'photoScale', width: 'photoWidth', height: 'photoHeight', x: 'photoX', y: 'photoY' };
      control('adjustPhoto').addEventListener('click', () => {
        for (const [key, id] of Object.entries(photoControls)) control(id).value = page.photo[key];
        control('photoMenu').close();
        control('photoDialog').showModal();
      });
      control('savePhoto').addEventListener('click', event => {
        const photo = { ...page.photo };
        for (const [key, id] of Object.entries(photoControls)) photo[key] = Number(control(id).value);
        if (!savePage({ ...page, photo })) event.preventDefault();
      });
      control('removePhoto').addEventListener('click', event => {
        if (!confirm('Remover a foto desta folha?') || !savePage({ ...page, photo: null })) event.preventDefault();
      });
      control('renameFolder').addEventListener('click', () => {
        const folder = library.folders[folderIndex];
        const name = prompt('Nome da pasta', folder.name)?.trim();
        if (!name) return;
        const folders = library.folders.slice();
        folders[folderIndex] = { ...folder, name };
        saveLibrary({ ...library, folders }, folderIndex, noteIndex, pageIndex);
      });
      control('deleteFolder').addEventListener('click', () => {
        const removed = new Set([folderIndex]);
        library.folders.forEach((folder, i) => {
          if (removed.has(folder.parent)) removed.add(i);
        });
        if (!confirm('Excluir esta pasta, suas subpastas e as notas que elas contêm?')) return;
        const newIndexes = new Map();
        const folders = library.folders.flatMap((folder, i) => {
          if (removed.has(i)) return [];
          newIndexes.set(i, newIndexes.size);
          return [{ ...folder, parent: newIndexes.get(folder.parent) ?? -1 }];
        });
        const notes = library.notes.filter(note => !removed.has(note.folder))
          .map(note => ({ ...note, folder: newIndexes.get(note.folder) ?? -1 }));
        saveLibrary({ folders, notes }, -1, notes.findIndex(note => note.folder === -1));
      });
      control('deleteNote').addEventListener('click', () => {
        if (!confirm('Excluir esta nota e todas as suas folhas?')) return;
        const notes = library.notes.filter((_, i) => i !== noteIndex);
        saveLibrary({ ...library, notes }, folderIndex, notes.findIndex(note => note.folder === folderIndex));
      });
      control('deletePage').addEventListener('click', () => {
        if (!confirm('Excluir esta folha?')) return;
        const note = library.notes[noteIndex];
        const pages = note.pages.filter((_, i) => i !== pageIndex);
        saveLibrary(withNote({ ...note, pages }), folderIndex, noteIndex, Math.min(pageIndex, pages.length - 1));
      });

      const backupFile = document.querySelector('#backupFile');
      const restoreButton = document.querySelector('#restoreBackup');
      restoreButton.addEventListener('click', () => {
        control('backupMenu').close();
        backupFile.click();
      });
      backupFile.addEventListener('change', async () => {
        const file = backupFile.files[0];
        backupFile.value = '';
        if (!file) return;

        restoreButton.disabled = true;
        try {
          await restoreBackup(file);
        } finally {
          restoreButton.disabled = false;
        }
      });
      document.querySelector('#clear').addEventListener('click', () => {
        if (actions.length && !confirm('Limpar todos os desenhos desta folha?')) return;
        actions.length = 0; current = null; redraw(); updateUndo(); persist();
      });
      document.addEventListener('keydown', e => {
        if (e.target.closest('dialog, input, select, textarea')) return;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault(); if (actions.length) { actions.pop(); redraw(); updateUndo(); persist(); }
        }
      });
      setTool('pen');
      showSelection();
      load();
      const header = document.querySelector('header');
      new ResizeObserver(() => {
        document.documentElement.style.setProperty('--header-height', `${header.offsetHeight}px`);
      }).observe(header);
    })();
  </script>
  <script>
    // O app funciona normalmente sem service worker durante os testes locais.
    // O cache offline é habilitado apenas em HTTPS ou localhost.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', {scope: './'})
          .catch(error => console.warn('Cache offline indisponível:', error));
      });
    }
  </script>
</body>
</html>
