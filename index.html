<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CadernoWeb">
  <meta name="description" content="Caderno de desenho com ferramentas para uso offline no iPad.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <title>CadernoWeb</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eff1f5; color: #1c2430; }
    header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #dce0e7; box-shadow: 0 2px 12px #1721390d; }
    .header-inner { max-width: 1050px; padding: 12px 16px; margin: auto; }
    h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -.02em; }
    .sub { margin: 0 0 12px; font-size: 12px; color: #657083; }
    .tools, .options { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .options, .library { margin-top: 9px; }
    .library { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .library label { display: flex; gap: 5px; align-items: center; font-size: 14px; min-width: 0; }
    select { font: inherit; max-width: min(210px, 55vw); min-height: 38px; }
    button { font: inherit; font-size: 14px; border: 1px solid #cdd4df; background: #f7f8fb; border-radius: 9px; padding: 9px 12px; color: inherit; cursor: pointer; }
    button:hover { background: #eaf0fa; }
    button:focus-visible { outline: 3px solid #73aaf2; outline-offset: 2px; }
    button[aria-pressed="true"] { background: #1675d1; border-color: #1675d1; color: #fff; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .right { margin-left: auto; }
    .status { font-size: 12px; color: #657083; }
    main { max-width: 1050px; margin: 20px auto 42px; padding: 0 16px; }
    .intro { font-size: 13px; color: #657083; margin: 0 0 12px; }
    .paper { position: relative; width: min(100%, 800px); aspect-ratio: 8 / 11; margin: 0 auto; background-color: white; border: 1px solid #d7dce6; border-radius: 3px; box-shadow: 0 10px 28px #1c26321c; overflow: hidden; }
    .paper.grid { background-image: linear-gradient(#b6d0ee55 1px, transparent 1px), linear-gradient(90deg, #b6d0ee55 1px, transparent 1px); background-size: 3.125% 2.272727%; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    #ink, #preview { touch-action: none; }
    #preview { pointer-events: none; }
    .help { text-align: center; font-size: 12px; color: #687589; margin: 16px auto 0; max-width: 800px; line-height: 1.5; }
    @media (max-width: 500px) { .header-inner { padding: 9px 11px; } h1 { font-size: 17px; } button { font-size: 13px; padding: 8px 10px; } main { margin-top: 12px; padding: 0 11px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>CadernoWeb</h1>
      <div class="library" aria-label="Organização do caderno">
        <label>Pasta <select id="folderSelect"></select></label>
        <button type="button" id="newFolder">Nova pasta</button>
        <label>Nota <select id="noteSelect"></select></label>
        <button type="button" id="newNote">Nova nota</button>
        <button type="button" id="renameNote">Renomear nota</button>
        <button type="button" id="moveNote">Mover nota</button>
        <label>Folha <select id="pageSelect"></select></label>
        <button type="button" id="newPage">Nova folha</button>
      </div>
      <dialog id="moveDialog">
        <form method="dialog">
          <label>Pasta de destino <select id="moveDestination"></select></label>
          <button value="cancel">Cancelar</button>
          <button id="confirmMove" value="move">Mover</button>
        </form>
      </dialog>
      <dialog id="pageDialog">
        <form method="dialog">
          <label>Papel da nova folha
            <select id="newPageStyle">
              <option value="grid">Quadriculado</option>
              <option value="blank">Em branco</option>
            </select>
          </label>
          <button value="cancel">Cancelar</button>
          <button id="confirmPage" value="create">Criar folha</button>
        </form>
      </dialog>
      <div class="tools" role="toolbar" aria-label="Ferramentas de desenho">
        <button type="button" data-tool="pen" aria-pressed="true">✏️ Caneta</button>
        <button type="button" data-tool="eraser" aria-pressed="false">◻ Borracha</button>
        <button type="button" data-tool="rectangle" aria-pressed="false">▭ Retângulo</button>
        <button type="button" data-tool="hand" aria-pressed="false">✋ Navegar</button>
        <button type="button" id="undo" class="right" disabled>↶ Voltar</button>
      </div>
      <div class="options">
        <button type="button" id="paperToggle">Papel: quadriculado</button>
        <button type="button" id="clear">Limpar folha</button>
        <button type="button" id="exportBackup">Exportar backup</button>
        <button type="button" id="restoreBackup">Restaurar backup</button>
        <input type="file" id="backupFile" accept=".json,application/json" hidden>
        <span id="status" class="status right" aria-live="polite">Carregando…</span>
      </div>
    </div>
  </header>
  <main>
    <p class="intro" id="location"></p>
    <section id="paper" class="paper grid" aria-label="Folha de desenho">
      <canvas id="ink" width="800" height="1100" aria-label="Área de desenho"></canvas>
      <canvas id="preview" width="800" height="1100" aria-hidden="true"></canvas>
    </section>
    <p class="help">Cada risco, apagamento ou retângulo é um passo do botão Voltar. A folha é salva automaticamente neste navegador. Esta é uma versão experimental — não use ainda para levantamentos reais.</p>
  </main>
  <script>
    (() => {
      'use strict';
      const W = 800, H = 1100;
      const STORAGE_KEY = 'cadernoweb-prototipo-1';
      const paper = document.querySelector('#paper');
      const canvas = document.querySelector('#ink');
      const preview = document.querySelector('#preview');
      const ctx = canvas.getContext('2d');
      const pctx = preview.getContext('2d');
      const status = document.querySelector('#status');
      const undoButton = document.querySelector('#undo');
      const folderSelect = document.querySelector('#folderSelect');
      const noteSelect = document.querySelector('#noteSelect');
      const pageSelect = document.querySelector('#pageSelect');
      const renameNote = document.querySelector('#renameNote');
      const moveNote = document.querySelector('#moveNote');
      const newPage = document.querySelector('#newPage');
      const locationLabel = document.querySelector('#location');
      let tool = 'pen';
      let library = initialLibrary();
      let folderIndex = -1;
      let noteIndex = 0;
      let pageIndex = 0;
      let page = library.notes[0].pages[0];
      let actions = page.actions;
      let current = null;
      let pointerId = null;

      function initialLibrary(firstPage = { actions: [], paperStyle: 'grid' }) {
        return { folders: [], notes: [{ title: 'Meu caderno', folder: -1, pages: [firstPage] }] };
      }

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          if (validLibrary(saved)) {
            library = saved;
            noteIndex = Number.isInteger(saved.noteIndex) && saved.notes[saved.noteIndex] ? saved.noteIndex : 0;
            folderIndex = saved.notes[noteIndex]?.folder ?? -1;
            pageIndex = saved.notes[noteIndex]?.pages[saved.pageIndex] ? Number(saved.pageIndex) : 0;
          } else if (Array.isArray(saved.actions)) {
            library = initialLibrary({
              actions: saved.actions.filter(validAction),
              paperStyle: saved.paperStyle === 'blank' ? 'blank' : 'grid'
            });
          }
        } catch {
          status.textContent = 'Não foi possível ler os dados salvos';
          return;
        }
        showSelection();
        status.textContent = 'Pronto';
      }

      function persist(nextLibrary = library, nextNote = noteIndex, nextPage = pageIndex) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            folders: nextLibrary.folders, notes: nextLibrary.notes,
            noteIndex: nextNote, pageIndex: nextPage
          }));
          status.textContent = 'Salvo neste navegador';
          return true;
        } catch {
          status.textContent = 'Não foi possível salvar neste navegador';
          return false;
        }
      }

      function setOptions(select, entries, selected) {
        select.replaceChildren(...entries.map(([label, value]) => new Option(label, String(value))));
        select.value = String(selected);
      }

      function folderName(index) {
        const names = [];
        while (index >= 0) {
          const folder = library.folders[index];
          names.unshift(folder.name);
          index = folder.parent;
        }
        return names.join(' / ') || 'Sem pasta';
      }

      function showSelection() {
        const note = library.notes[noteIndex];
        page = note?.pages[pageIndex];
        actions = page?.actions ?? [];
        if (pointerId !== null && canvas.hasPointerCapture(pointerId)) {
          canvas.releasePointerCapture(pointerId);
        }
        current = null;
        pointerId = null;

        setOptions(folderSelect, [['Sem pasta', -1], ...library.folders.map((_, i) => [folderName(i), i])], folderIndex);
        const notes = library.notes.flatMap((item, i) => item.folder === folderIndex ? [[item.title, i]] : []);
        setOptions(noteSelect, notes.length ? notes : [['Nenhuma nota', -1]], noteIndex);
        setOptions(pageSelect, note ? note.pages.map((_, i) => [`Folha ${i + 1}`, i]) : [], pageIndex);
        noteSelect.disabled = pageSelect.disabled = renameNote.disabled = moveNote.disabled = newPage.disabled = !note;
        document.querySelector('#paperToggle').disabled = document.querySelector('#clear').disabled = !page;
        paper.hidden = !page;
        locationLabel.textContent = page ? `${note.title} · Folha ${pageIndex + 1}` : 'Crie uma nota para começar.';
        updatePaper();
        updateUndo();
        redraw();
      }

      function select(nextFolder, nextNote, nextPage = 0) {
        folderIndex = nextFolder;
        noteIndex = nextNote;
        pageIndex = nextPage;
        showSelection();
      }

      function saveLibrary(next, folder, note, sheet = 0) {
        if (!persist(next, note, sheet)) {
          showSelection();
          return false;
        }
        library = next;
        select(folder, note, sheet);
        return true;
      }

      async function exportBackup() {
        const exportedAt = new Date().toISOString();
        const backup = { app: 'CadernoWeb', version: 2, exportedAt, folders: library.folders, notes: library.notes };
        const filename = `cadernoweb-backup-${exportedAt.replace(/[:.]/g, '-')}.json`;
        let downloadUrl;
        try {
          const file = new File([JSON.stringify(backup)], filename, { type: 'application/json' });
          const shareData = { files: [file] };
          if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
            try {
              await navigator.share(shareData);
              return;
            } catch (error) {
              if (error.name === 'AbortError') return;
            }
          }

          downloadUrl = URL.createObjectURL(file);
          const link = document.createElement('a');
          link.href = downloadUrl;
          link.download = filename;
          document.body.appendChild(link);
          try {
            link.click();
          } finally {
            link.remove();
          }
        } catch {
          status.textContent = 'Não foi possível exportar o backup';
        } finally {
          if (downloadUrl) setTimeout(() => URL.revokeObjectURL(downloadUrl), 30000);
        }
      }

      function validAction(action) {
        if (!action) return false;
        if (action.kind === 'rectangle') {
          return [action.x, action.y, action.w, action.h].every(Number.isFinite)
            && action.w >= 0 && action.h >= 0;
        }
        return ['pen', 'eraser'].includes(action.kind)
          && Array.isArray(action.points) && action.points.length > 0
          && action.points.every(point => Array.isArray(point)
            && point.length === 2 && point.every(Number.isFinite));
      }

      async function restoreBackup(file) {
        let backup;
        try {
          backup = JSON.parse(await file.text());
        } catch {
          status.textContent = 'Não foi possível ler o arquivo de backup';
          return;
        }

        const legacy = backup?.app === 'CadernoWeb' && backup.version === 1 && validPage(backup);
        const complete = backup?.app === 'CadernoWeb' && backup.version === 2 && validLibrary(backup);
        if (!legacy && !complete) {
          status.textContent = 'Arquivo de backup inválido ou incompatível';
          return;
        }

        if (legacy && page) {
          if (!confirm('Substituir o desenho e o papel da folha atual pelo backup?')) return;
          const pages = library.notes[noteIndex].pages.slice();
          pages[pageIndex] = { actions: backup.actions, paperStyle: backup.paperStyle };
          if (!saveLibrary(withNote({ ...library.notes[noteIndex], pages }), folderIndex, noteIndex, pageIndex)) return;
        } else if (legacy) {
          if (!confirm('Criar uma nota com a folha deste backup?')) return;
          const note = { title: 'Nota restaurada', folder: folderIndex,
            pages: [{ actions: backup.actions, paperStyle: backup.paperStyle }] };
          if (!saveLibrary({ ...library, notes: [...library.notes, note] }, folderIndex, library.notes.length)) return;
        } else {
          if (!confirm('Substituir todas as pastas, notas e folhas pelo conteúdo deste backup?')) return;
          const next = { folders: backup.folders, notes: backup.notes };
          if (!saveLibrary(next, next.notes[0]?.folder ?? -1, next.notes.length ? 0 : -1)) return;
        }
        status.textContent = 'Backup restaurado e salvo neste navegador';
      }

      function validPage(value) {
        return value && ['blank', 'grid'].includes(value.paperStyle)
          && Array.isArray(value.actions) && value.actions.every(validAction);
      }

      function validLibrary(value) {
        return value && Array.isArray(value.folders) && Array.isArray(value.notes)
          && value.folders.every((folder, i) => folder && typeof folder.name === 'string'
            && Number.isInteger(folder.parent) && folder.parent >= -1 && folder.parent < i)
          && value.notes.every(note => note && typeof note.title === 'string'
            && Number.isInteger(note.folder) && note.folder >= -1 && note.folder < value.folders.length
            && Array.isArray(note.pages) && note.pages.length > 0 && note.pages.every(validPage));
      }

      function withNote(note) {
        const notes = library.notes.slice();
        notes[noteIndex] = note;
        return { ...library, notes };
      }

      function updateUndo() { undoButton.disabled = actions.length === 0; }
      function updatePaper() {
        const grid = page?.paperStyle !== 'blank';
        paper.classList.toggle('grid', grid);
        document.querySelector('#paperToggle').textContent = grid ? 'Papel: quadriculado' : 'Papel: em branco';
      }

      function drawAction(target, action) {
        if (!action) return;
        target.save();
        target.lineCap = 'round';
        target.lineJoin = 'round';
        if (action.kind === 'rectangle') {
          target.strokeStyle = '#17202a'; target.lineWidth = 2.7;
          const {x, y, w, h} = action;
          target.strokeRect(x, y, w, h);
        } else {
          target.globalCompositeOperation = action.kind === 'eraser' ? 'destination-out' : 'source-over';
          target.strokeStyle = action.kind === 'eraser' ? '#000' : '#18232d';
          target.lineWidth = action.kind === 'eraser' ? 22 : 2.8;
          const pts = action.points || [];
          if (pts.length) {
            target.beginPath();
            target.moveTo(pts[0][0], pts[0][1]);
            if (pts.length === 1) {
              target.lineTo(pts[0][0] + .01, pts[0][1] + .01);
            } else {
              for (let i=1; i<pts.length; i++) target.lineTo(pts[i][0], pts[i][1]);
            }
            target.stroke();
          }
        }
        target.restore();
      }

      function redraw() {
        ctx.clearRect(0, 0, W, H);
        for (const a of actions) drawAction(ctx, a);
        if (current && current.kind !== 'rectangle') drawAction(ctx, current);
        pctx.clearRect(0, 0, W, H);
        if (current && current.kind === 'rectangle') drawAction(pctx, current);
      }

      function point(e) {
        const b = canvas.getBoundingClientRect();
        return [Math.max(0, Math.min(W, (e.clientX - b.left) * W / b.width)),
                Math.max(0, Math.min(H, (e.clientY - b.top) * H / b.height))];
      }
      function syncRectangle(a, x, y) {
        a.x = Math.min(a.startX, x); a.y = Math.min(a.startY, y);
        a.w = Math.abs(x - a.startX); a.h = Math.abs(y - a.startY);
      }
      function setTool(next) {
        tool = next;
        document.querySelectorAll('[data-tool]').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.tool === next)));
        canvas.style.pointerEvents = next === 'hand' ? 'none' : 'auto';
        canvas.style.touchAction = next === 'hand' ? 'auto' : 'none';
        canvas.style.cursor = next === 'hand' ? 'default' : next === 'eraser' ? 'cell' : 'crosshair';
        current = null; pointerId = null; redraw();
      }

      canvas.addEventListener('pointerdown', e => {
        if (!page || tool === 'hand' || pointerId !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
        e.preventDefault();
        pointerId = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        const [x, y] = point(e);
        current = tool === 'rectangle'
          ? { kind: 'rectangle', startX: x, startY: y, x, y, w: 0, h: 0 }
          : { kind: tool, points: [[x, y]] };
        status.textContent = 'Desenhando…';
        redraw();
      });
      canvas.addEventListener('pointermove', e => {
        if (!current || e.pointerId !== pointerId) return;
        e.preventDefault();
        const events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
        for (const ev of events.length ? events : [e]) {
          const [x, y] = point(ev);
          if (current.kind === 'rectangle') syncRectangle(current, x, y);
          else {
            const last = current.points[current.points.length-1];
            if (Math.hypot(x - last[0], y - last[1]) > .65) current.points.push([x, y]);
          }
        }
        redraw();
      });
      function finish(e, cancelled) {
        if (!current || e.pointerId !== pointerId) return;
        e.preventDefault();
        if (!cancelled) {
          const [x, y] = point(e);
          if (current.kind === 'rectangle') syncRectangle(current, x, y);
          else current.points.push([x, y]);
          const a = current;
          if (a.kind !== 'rectangle' || a.w >= 3 || a.h >= 3) {
            if (a.kind === 'rectangle') { delete a.startX; delete a.startY; }
            actions.push(a);
          }
        }
        current = null;
        if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
        pointerId = null;
        redraw(); updateUndo(); persist();
      }
      canvas.addEventListener('pointerup', e => finish(e, false));
      canvas.addEventListener('pointercancel', e => finish(e, true));
      document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
      undoButton.addEventListener('click', () => { if (!actions.length) return; actions.pop(); redraw(); updateUndo(); persist(); });
      document.querySelector('#paperToggle').addEventListener('click', () => {
        page.paperStyle = page.paperStyle === 'grid' ? 'blank' : 'grid';
        updatePaper();
        persist();
      });
      folderSelect.addEventListener('change', () => {
        const folder = Number(folderSelect.value);
        select(folder, library.notes.findIndex(note => note.folder === folder));
        persist();
      });
      noteSelect.addEventListener('change', () => {
        select(folderIndex, Number(noteSelect.value));
        persist();
      });
      pageSelect.addEventListener('change', () => {
        select(folderIndex, noteIndex, Number(pageSelect.value));
        persist();
      });
      document.querySelector('#newFolder').addEventListener('click', () => {
        const name = prompt('Nome da nova pasta')?.trim();
        if (!name) return;
        const folders = [...library.folders, { name, parent: folderIndex }];
        saveLibrary({ ...library, folders }, folders.length - 1, -1);
      });
      document.querySelector('#newNote').addEventListener('click', () => {
        const title = prompt('Nome da nova nota', 'Nova nota')?.trim();
        if (!title) return;
        const note = { title, folder: folderIndex, pages: [{ actions: [], paperStyle: 'grid' }] };
        saveLibrary({ ...library, notes: [...library.notes, note] }, folderIndex, library.notes.length);
      });
      renameNote.addEventListener('click', () => {
        const note = library.notes[noteIndex];
        const title = prompt('Nome da nota', note.title)?.trim();
        if (title) saveLibrary(withNote({ ...note, title }), folderIndex, noteIndex, pageIndex);
      });
      moveNote.addEventListener('click', () => {
        setOptions(document.querySelector('#moveDestination'),
          [['Sem pasta', -1], ...library.folders.map((_, i) => [folderName(i), i])], folderIndex);
        document.querySelector('#moveDialog').showModal();
      });
      document.querySelector('#confirmMove').addEventListener('click', event => {
        const folder = Number(document.querySelector('#moveDestination').value);
        if (!saveLibrary(withNote({ ...library.notes[noteIndex], folder }), folder, noteIndex, pageIndex)) {
          event.preventDefault();
        }
      });
      newPage.addEventListener('click', () => {
        document.querySelector('#pageDialog').showModal();
      });
      document.querySelector('#confirmPage').addEventListener('click', event => {
        const paperStyle = document.querySelector('#newPageStyle').value;
        const note = library.notes[noteIndex];
        const pages = [...note.pages, { actions: [], paperStyle }];
        if (!saveLibrary(withNote({ ...note, pages }), folderIndex, noteIndex, pages.length - 1)) {
          event.preventDefault();
        }
      });
      document.querySelector('#exportBackup').addEventListener('click', exportBackup);
      const backupFile = document.querySelector('#backupFile');
      const restoreButton = document.querySelector('#restoreBackup');
      restoreButton.addEventListener('click', () => backupFile.click());
      backupFile.addEventListener('change', async () => {
        const file = backupFile.files[0];
        backupFile.value = '';
        if (!file) return;

        restoreButton.disabled = true;
        try {
          await restoreBackup(file);
        } finally {
          restoreButton.disabled = false;
        }
      });
      document.querySelector('#clear').addEventListener('click', () => {
        if (actions.length && !confirm('Limpar todos os desenhos desta folha?')) return;
        actions.length = 0; current = null; redraw(); updateUndo(); persist();
      });
      document.addEventListener('keydown', e => {
        if (e.target.closest('dialog, input, select')) return;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault(); if (actions.length) { actions.pop(); redraw(); updateUndo(); persist(); }
        }
      });
      setTool('pen');
      showSelection();
      load();
    })();
  </script>
  <script>
    // O app funciona normalmente sem service worker durante os testes locais.
    // O cache offline é habilitado apenas em HTTPS ou localhost.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', {scope: './'})
          .catch(error => console.warn('Cache offline indisponível:', error));
      });
    }
  </script>
</body>
</html>
